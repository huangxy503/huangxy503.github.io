function _tipBody(t){
  let body="";
  if(t.groups&&t.groups.length){
    body=t.groups.map(g=>`<div class="tip-cat">${esc(g.name)}</div>`+
      (g.items||[]).map(it=>`<div class="tip-item"><div class="ti-name">${esc(it.name.replace(/[\★\☆\*]+/g,''))}</div>${it.detail?`<div class="ti-detail">${esc(it.detail)}</div>`:''}</div>`).join("")).join("");
  } else if(t.blocks&&t.blocks.length){
    body=t.blocks.map(b=> b.kind==="subtitle"
      ? `<div class="tip-sub">${esc(b.subtitle)}</div><div class="tip-body">${_renderTipText(b.text)}</div>`
      : `<div class="tip-body">${_renderTipText(b.text)}</div>`).join("");
  }
  return body;
}
function _renderTipText(text){
  if(!text) return '';
  // 按换行分段，每段前加圆点；空行跳过；清理段首 * 和数字编号
  return text.split('\n').filter(s=>s.trim()).map(s=>{
    let t = s.trim();
    t = t.replace(/^[\*·\s]+/, '').replace(/^[①②③④⑤⑥⑦⑧⑨⑩]+\s*/,'').replace(/^\(?[（(]?\d+[）)．.、:\s]+/, '');
    return `<div class="tip-p"><span class="tip-bullet">•</span>${esc(t)}</div>`;
  }).join('');
}
/* ============== 贴士：组织者改写/删除/新增 ============== */
let _tipBuf=null, _tipIdx=-1;
function delTip(i){confirmSheet('确定删除该贴士「'+(state.tips[i]?state.tips[i].title:'')+'」？',()=>{const title=state.tips[i]?state.tips[i].title:"贴士",before=beginOperation(["tips"]);state.tips.splice(i,1);recordOperation("tip","删除了贴士「"+title+"」",["tips"],before,false);persist();render();});}
function addTip(){_tipIdx=-1;_tipBuf={title:'新贴士',type:'items',groups:[{name:'分类一',items:[{name:'',detail:''}]}],blocks:[]};_renderTipSheet();}
function editTip(i){_tipIdx=i;_tipBuf=JSON.parse(JSON.stringify(state.tips[i]));
  if(!_tipBuf.type)_tipBuf.type=(_tipBuf.groups&&_tipBuf.groups.length)?'items':((_tipBuf.blocks&&_tipBuf.blocks.length)?'blocks':'items');
  if(_tipBuf.type==='items'&&!_tipBuf.groups)_tipBuf.groups=[];
  if(_tipBuf.type==='blocks'&&!_tipBuf.blocks)_tipBuf.blocks=[];
  _renderTipSheet();}
function _syncTipBuf(){
  _tipBuf.title=document.querySelector('[data-tt="title"]').value;
  if(_tipBuf.type==='items'){
    _tipBuf.groups=[...document.querySelectorAll('.tip-cat-row')].map(cr=>{
      const name=cr.querySelector('[data-cn]').value;
      const items=[...cr.querySelectorAll('.tip-item-row')].map(ir=>({name:ir.querySelector('[data-in]').value,detail:ir.querySelector('[data-id]').value}));
      return {name,items};
    });
  } else {
    _tipBuf.blocks=[...document.querySelectorAll('.tip-block-row')].map(br=>{
      const kind=br.dataset.kind;
      if(kind==='subtitle')return{kind,subtitle:br.querySelector('[data-bs]').value,text:br.querySelector('[data-bt]').value};
      return{kind:'text',text:br.querySelector('[data-bt]').value};
    });
  }
}
function _renderTipSheet(){
  const t=_tipBuf;
  let inner=`<h3>编辑贴士</h3><div class="f-item"><label>标题</label><input data-tt="title" value="${esc(t.title)}"></div>`;
  if(t.type==='items'){
    inner+=`<div class="hint">分类与条目均可增删改</div>`;
    t.groups.forEach((g,gi)=>{
      inner+=`<div class="tip-cat-row" style="border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0">
        <div style="display:flex;gap:6px;align-items:center"><input data-cn value="${esc(g.name)}" style="flex:1;font-weight:600"><button class="mini del" data-del-cat="${gi}">删分类</button></div>`;
      g.items.forEach((it,ii)=>{
        inner+=`<div class="tip-item-row" style="display:flex;gap:6px;margin-top:6px"><input data-in value="${esc(it.name)}" placeholder="名称" style="flex:1"><input data-id value="${esc(it.detail||'')}" placeholder="说明" style="flex:1.4"><button class="mini del" data-del-item="${gi}-${ii}">删</button></div>`;
      });
      inner+=`<button class="btn sm" data-add-item="${gi}" style="margin-top:6px">+ 添加条目</button></div>`;
    });
    inner+=`<button class="btn sm" data-add-cat style="margin-top:8px">+ 添加分类</button>`;
  } else {
    t.blocks.forEach((b,bi)=>{
      if(b.kind==='subtitle'){
        inner+=`<div class="tip-block-row" data-kind="subtitle" style="border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0"><input data-bs value="${esc(b.subtitle||'')}" placeholder="小标题" style="font-weight:600"><textarea data-bt placeholder="正文">${esc(b.text||'')}</textarea><button class="mini del" data-del-block="${bi}">删</button></div>`;
      } else {
        inner+=`<div class="tip-block-row" data-kind="text" style="border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0"><textarea data-bt placeholder="正文">${esc(b.text||'')}</textarea><button class="mini del" data-del-block="${bi}">删</button></div>`;
      }
    });
    inner+=`<button class="btn sm" data-add-block style="margin-top:8px">+ 添加正文</button>`;
  }
  inner+=`<button class="btn" onclick="saveTip()">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  const m=$("#mask");
  if(m){ m.querySelector(".sheet").innerHTML=inner; }
  else { showSheet(inner); }
  document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>{_syncTipBuf();_tipBuf.groups.splice(+b.dataset.delCat,1);_renderTipSheet();});
  document.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=()=>{_syncTipBuf();const a=b.dataset.delItem.split('-');_tipBuf.groups[+a[0]].items.splice(+a[1],1);_renderTipSheet();});
  document.querySelectorAll('[data-add-item]').forEach(b=>b.onclick=()=>{_syncTipBuf();_tipBuf.groups[+b.dataset.addItem].items.push({name:'',detail:''});_renderTipSheet();});
  document.querySelectorAll('[data-add-cat]').forEach(b=>b.onclick=()=>{_syncTipBuf();_tipBuf.groups.push({name:'新分类',items:[]});_renderTipSheet();});
  document.querySelectorAll('[data-del-block]').forEach(b=>b.onclick=()=>{_syncTipBuf();_tipBuf.blocks.splice(+b.dataset.delBlock,1);_renderTipSheet();});
  document.querySelectorAll('[data-add-block]').forEach(b=>b.onclick=()=>{_syncTipBuf();_tipBuf.blocks.push({kind:'text',text:''});_renderTipSheet();});
}
function saveTip(){
  _syncTipBuf();
  const copy=JSON.parse(JSON.stringify(_tipBuf));
  const before=beginOperation(["tips"]),isNew=_tipIdx<0;
  if(isNew) state.tips.push(copy);
  else state.tips[_tipIdx]=copy;
  recordOperation("tip",(isNew?"新增了贴士「":"修改了贴士「")+copy.title+"」",["tips"],before,false);
  persist();closeSheet();render();
}

/* ============== 行程 ============== */
function transIcon(trans){
  if(!trans) return '';
  if(trans.includes('飞机')) return '✈️';
  if(trans.includes('自驾')) return '🚗';
  if(trans.includes('徒步')) return '🥾';
  return '🚗'; // 默认
}
function compactScheduleDate(date){
  const s=String(date||"");
  const m=s.match(/(\d{1,2})月(\d{1,2})日?/);
  return m ? String(m[1]).padStart(2,"0")+"."+String(m[2]).padStart(2,"0") : s;
}
function scheduleStory(day){
  const copy={};
  return copy[day.week] || "今日行程";
}
function scheduleRoute(day){
  const found=(state.overview||[]).find(o=>o.day===day.week)||{};
  return {route:found.route||day.title||"路线待定",km:found.km||""};
}
function scheduleEventType(it){
  const text=((it.act||"")+" "+(it.trans||"")).toLowerCase();
  if((it.trans||"") || /航班|机场|起飞|抵达|自驾|车辆|车程|接送/.test(text)) return "transport";
  if(/午餐|晚餐|早餐|用餐|吃饭|茶/.test(text)) return "meal";
  if(/入住|酒店|民宿|住宿|休息/.test(text)) return "stay";
  if(/集合|接机|合影|签到|出发|团建/.test(text)) return "gathering";
  return "activity";
}
function scheduleEventLabel(kind){return {transport:"交通",gathering:"集合",meal:"用餐",stay:"住宿",activity:"活动"}[kind]||"活动";}
function scheduleTimelineItem(it,index,isAdmin){
  const kind=scheduleEventType(it);
  const note=[it.end?"至 "+it.end:"",it.trans||""].filter(Boolean).join(" · ");
  const controls=isAdmin?`<div class="timeline-admin-actions"><button class="mini" onclick="editSchedItem(${ctx.schedDay},${index})">改</button><button class="mini del" onclick="delSchedItem(${ctx.schedDay},${index})">删</button></div>`:"";
  const noteExtra=it.note?`<div class="timeline-item-note${isAdmin?' admin-note':''}">${isAdmin?'📝 ':''}${esc(it.note)}</div>`:"";
  const cardId=it.itemId?` id="sched-item-${esc(it.itemId)}"`:"";
  return `<article class="timeline-item kind-${kind}">
    <time class="timeline-time">${esc(it.start||"—")}</time>
    <div class="timeline-rail" aria-hidden="true"><span class="timeline-dot"></span></div>
    <div class="timeline-card"${cardId}><div class="timeline-event">${esc(it.act||"待定行程")}</div>
      <div class="timeline-foot"><span class="timeline-note">${esc(note||"当日行程")}</span><span class="event-tag ${kind}">${scheduleEventLabel(kind)}</span></div>${noteExtra}${controls}
    </div>
  </article>`;
}
function scheduleTabs(){
  return `<div class="sched-tabs" aria-label="行程日期切换">`+state.schedule.map((d,i)=>
    `<button class="sched-tab ${ctx.schedDay===i?'on':''}" onclick="goSchedDay(${i})"><span class="sched-day">${esc(d.week)}</span><span class="sched-date">${esc(compactScheduleDate(d.date))}</span></button>`).join("")+`</div>`;
}
function goSchedDay(i){ctx.schedDay=i;render();}
function toggleRouteOverview(){ctx.routeOverview=!ctx.routeOverview;render();}
function scheduleRouteDrawer(){
  const ov=state.overview||[];
  const isAdmin=ctx.role==="admin";
  if(!ctx.routeOverview || (!ov.length&&!isAdmin)) return "";
  const stops=ov.map(o=>{
    const acts=isAdmin?`<div class="route-stop-actions"><button class="mini" onclick="editOverviewDay('${esc(o.day)}')">改</button><button class="mini del" onclick="delOverviewDay('${esc(o.day)}')">删</button></div>`:"";
    return `<div class="route-stop"><span class="route-stop-day">${esc(o.day)}</span><span class="route-stop-main">${esc(o.route)}</span><span class="route-stop-km">${esc(o.km)}</span>${acts}</div>`;
  }).join("");
  const empty=isAdmin&&!ov.length?`<div class="schedule-timeline-empty">还没有路线概览，可以先新增第一天的总路线。</div>`:"";
  const addBtn=isAdmin?`<button class="route-drawer-add" onclick="addOverviewDay()">+ 新增一天总路线</button>`:"";
  return `<section class="route-drawer ${isAdmin?'route-overview-edit':''}" aria-label="全部行程概览"><div class="route-drawer-title">全部行程概览${isAdmin?'（可编辑）':''}</div>`+stops+empty+addBtn+`</section>`;
}
function editOverviewDay(day){
  const o=(state.overview||[]).find(x=>x.day===day)||{day:day||"",route:"",km:""};
  showSheet(`<h3>${day?('编辑 '+esc(day)+' 总路线'):'新增总路线'}</h3>`+
    `<div class="f-item"><label>天数（如 D1）</label><input data-ok="day" value="${esc(o.day||'')}"></div>`+
    `<div class="f-item"><label>当日总路线</label><input data-ok="route" value="${esc(o.route||'')}" placeholder="如：索松村—尼洋河风光带—巴松措"></div>`+
    `<div class="f-item"><label>全程公里（如 247公里）</label><input data-ok="km" value="${esc(o.km||'')}"></div>`+
    `<button class="btn" onclick="saveOverviewDay('${esc(day||'__new__')}')">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`);
}
function saveOverviewDay(oldDay){
  const day=document.querySelector('[data-ok="day"]').value.trim();
  const route=document.querySelector('[data-ok="route"]').value.trim();
  const km=document.querySelector('[data-ok="km"]').value.trim();
  if(!day){toast("请填写天数，如 D1");return;}
  const before=beginOperation(["overview"]);
  state.overview=state.overview||[];
  const idx=oldDay&&oldDay!=='__new__'?state.overview.findIndex(x=>x.day===oldDay):state.overview.findIndex(x=>x.day===day);
  const rec=idx>=0?state.overview[idx]:{};
  rec.day=day; rec.route=route; rec.km=km;
  if(idx<0)state.overview.push(rec);
  recordOperation("schedule",(idx<0?"新增了":"修改了")+day+" 总路线",["overview"],before,true);
  persist();closeSheet();render();
}
function delOverviewDay(day){confirmSheet('确定删除「'+esc(day)+'」的总路线？',()=>{const before=beginOperation(["overview"]);state.overview=(state.overview||[]).filter(x=>x.day!==day);recordOperation("schedule","删除了 "+day+" 总路线",["overview"],before,true);persist();render();});}
function addOverviewDay(){editOverviewDay('');}
function goSchedTab(i){if(i===1&&!tipsEnabled())i=0;ctx.schedTab=i;render();}
function scheduleView(){
  const isAdmin=ctx.role==="admin";
  if(ctx.schedTab==null) ctx.schedTab=0;
  const showTips=tipsEnabled();
  if(!showTips&&ctx.schedTab===1)ctx.schedTab=0;

  // —— 顶部大 Tab（行程 / 贴士）——
  const mainTabs=showTips?`<div class="sched-main-tabs">
    <button class="sched-main-tab ${ctx.schedTab===0?'on':''}" onclick="goSchedTab(0)">行程</button>
    <button class="sched-main-tab ${ctx.schedTab===1?'on':''}" onclick="goSchedTab(1)">贴士 <small>${(state.tips||[]).length}条</small></button>
  </div>`:"";

  // —— 贴士内容 ——（贴士tab时，需要一个占位块把内容推到header下方）
  if(showTips&&ctx.schedTab===1){
    const PIN_TITLE = "领队联系方式";
    const tipOrder = (state.tips||[]).map((t,i)=>({t,i}))
                      .sort((a,b)=> (b.t.title===PIN_TITLE) - (a.t.title===PIN_TITLE));
    let tipHtml;
    if(isAdmin){
      if(!tipOrder.length) tipHtml=`<div class="empty-note">暂无贴士内容</div><button class="btn" onclick="addTip()">+ 新增贴士</button>`;
      else {
        let th='';
        tipOrder.forEach(({t,i})=>{
          th+=`<div class="card ${tipTone(t)}"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${esc(t.title)}</h3><div><button class="mini" onclick="editTip(${i})">改</button> <button class="mini del" onclick="delTip(${i})">删</button></div></div>${_tipBody(t)}</div>`;
        });
        th+=`<button class="btn" onclick="addTip()">+ 新增贴士</button>`;
        tipHtml=th;
      }
    } else {
      if(!tipOrder.length) tipHtml=`<div class="empty-note">暂无贴士内容</div>`;
      else tipHtml=`<div class="hint">出行必看小贴士。建议出发前通读一遍。</div>`+tipOrder.map(({t})=>`<div class="card ${tipTone(t)}"><h3>${esc(t.title)}</h3>${_tipBody(t)}</div>`).join("");
    }
    // sched-tip-wrap 负责补偿 header 高度，让 mainTabs 出现在 header 下方
    return `<div class="schedule-page"><div class="sched-tip-wrap">${mainTabs}<div class="sched-tip-body">${tipHtml}</div></div></div>`;
  }

  // —— 行程内容 ——
  if(!state.schedule || !state.schedule.length){
    const organizerStart=isAdmin?`<div class="schedule-empty-actions"><button class="btn" onclick="editSchedDay(-1)">新增第一天行程</button><button class="btn ghost" onclick="ctx.routeOverview=true;render()">编辑全部行程概览</button></div>`:"";
    const emptyCopy=isAdmin?"先新增活动的第一天，再逐段填写当天安排；也可以先整理全部行程概览。":"组织者还在安排中，确定后会在这里显示。";
    return `<div class="schedule-page"><div class="sched-tip-wrap">${mainTabs}</div><div class="schedule-empty"><div class="schedule-empty-title">还没有行程</div><div class="schedule-empty-copy">${emptyCopy}</div>${organizerStart}</div>${isAdmin?scheduleRouteDrawer():""}</div>`;
  }
  if(ctx.schedDay==null||ctx.schedDay>=state.schedule.length)ctx.schedDay=0;
  const d=state.schedule[ctx.schedDay];
  if(!d) return `<div class="schedule-page"><div class="sched-tip-wrap">${mainTabs}</div><div class="schedule-empty">行程数据异常</div></div>`;
  if(!Array.isArray(d.items))d.items=[];
  const r=scheduleRoute(d);
  const routeBtn=((state.overview||[]).length||isAdmin)?`<button class="route-toggle" onclick="toggleRouteOverview()">${ctx.routeOverview?'收起概览':'全部概览'}</button>`:"";
  const routeScene=`<svg class="route-mountains" viewBox="0 0 394 160" preserveAspectRatio="none" aria-hidden="true"><circle cx="318" cy="34" r="19" fill="#ffe28a"/><path d="M0 116 L48 68 L94 99 L145 48 L198 98 L250 61 L304 101 L350 70 L394 104 L394 160 L0 160 Z" fill="#b9d59f"/><path d="M0 133 L50 96 L101 124 L156 78 L209 126 L262 88 L315 122 L363 98 L394 117 L394 160 L0 160 Z" fill="#80c977"/><path d="M0 145 C49 132 89 148 132 137 C184 124 223 150 268 138 C310 127 352 143 394 132 L394 160 L0 160 Z" fill="#f1a06f"/></svg>`;
  const routeSummary=`<section class="route-summary">${routeScene}<div class="route-copy"><div class="route-title">${esc(d.week||("第 "+(ctx.schedDay+1)+" 天"))} · ${scheduleStory(d)}</div><div class="route-subtitle">${esc(r.route)}</div>${r.km?`<div class="route-km">全程 ${esc(r.km)}</div>`:""}</div>${routeBtn}</section>`;
  const dayManage=isAdmin?`<div class="schedule-day-manage"><span>正在编辑：${esc(d.week||("第 "+(ctx.schedDay+1)+" 天"))}${d.date?" · "+esc(d.date):""}</span><div class="schedule-day-manage-actions"><button class="mini" onclick="editSchedDay(${ctx.schedDay})">编辑当天</button><button class="mini del" onclick="delSchedDay(${ctx.schedDay})">删除当天</button></div></div>`:"";
  const timeline=d.items.length?`<section class="schedule-timeline" aria-label="${esc(d.week||"当日")} 时间线">${d.items.map((it,i)=>scheduleTimelineItem(it,i,isAdmin)).join("")}</section>`:`<div class="schedule-timeline-empty">${isAdmin?'这一天还没有具体安排，点击下方按钮新增第一个时段。':'当天具体安排待定。'}</div>`;
  const adminControls=isAdmin?`<div class="schedule-admin-add"><button class="btn" onclick="addSchedItem(${ctx.schedDay})">新增时段</button></div><button class="btn schedule-add-day" onclick="editSchedDay(-1)">新增一天行程</button>`:"";
  // 行程tab：mainTabs 嵌在 routeSummary 之后，不受负margin影响
  return `<div class="schedule-page">${routeSummary}${mainTabs}${scheduleRouteDrawer()}${scheduleTabs()}${dayManage}<div class="schedule-section-head"><h2>当天安排</h2></div>${timeline}${adminControls}</div>`;
}
function editSchedDay(di){
  const d = di<0?{date:'',week:'',title:'',tip:''}:state.schedule[di];
  const hf=(k,lab)=>`<div class="f-item"><label>${lab}</label><input data-sk="${k}" value="${esc(d[k]||'')}"></div>`;
  const isNew=di<0;
  const pushHtml=`<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;cursor:pointer;margin:10px 0 4px">
    <input type="checkbox" id="schedDayPush" ${isNew?'checked':''} style="accent-color:var(--sun-purple);width:16px;height:16px">
    <span>📣 推送给参与者「行程有更新」</span>
  </label>
  <input id="schedDayNote" placeholder="可选：补充说明" style="width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;box-sizing:border-box;display:${isNew?'block':'none'};margin-bottom:8px">`;
  showSheet(`<h3>${isNew?'新增行程日':'编辑当日信息'}</h3>${hf('week','第几天（如 D1）')}${hf('date','日期（如 11月08日）')}${hf('title','当日主题 / 路线')}${pushHtml}<button class="btn" onclick="saveSchedDay(${di})">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`);
  const chk=document.getElementById('schedDayPush'),note=document.getElementById('schedDayNote');
  if(chk&&note) chk.onchange=()=>{note.style.display=chk.checked?'block':'none';};
}
function saveSchedDay(di){
  const before=beginOperation(["schedule"]),isNew=di<0;
  const o = isNew?{items:[]}:state.schedule[di];
  ['week','date','title'].forEach(k=>{o[k]=document.querySelector('[data-sk="'+k+'"]').value.trim();});
  const shouldPush=!!(document.getElementById('schedDayPush')&&document.getElementById('schedDayPush').checked);
  const note=((document.getElementById('schedDayNote')&&document.getElementById('schedDayNote').value)||"").trim();
  if(isNew)state.schedule.push(o);
  recordOperation("schedule",(isNew?"新增了":"修改了")+(o.week||"行程日")+" 行程",["schedule"],before,true);
  try{
    if(shouldPush){
      const dayLabel=o.week||o.date||"行程日";
      addPushNotice({module:"行程",action:isNew?"新增":"更新",title:dayLabel+(isNew?" 行程已新增":" 行程有更新"),body:note||(isNew?"新增了「"+dayLabel+"」行程，请查看最新安排。":"「"+dayLabel+"」行程信息已更新，请查看最新安排。"),refId:"schedule"});
    }
  }catch(e){console.error("[saveSchedDay push]",e);}
  persist();closeSheet();render();
}
function editSchedItem(di,ii){
  const it=state.schedule[di].items[ii];
  const isNew=!it.start&&!it.end&&!it.act;
  const hf=(k,lab)=>`<div class="f-item"><label>${lab}</label><input data-ik="${k}" value="${esc(it[k]||'')}"></div>`;
  const dayLabel=state.schedule[di].week||state.schedule[di].date||("D"+(di+1));
  showSheet(`<h3>${isNew?"新增时段":"编辑时段"}</h3>${hf('start','开始时间')}${hf('end','结束时间')}${hf('act','事项')}
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;cursor:pointer;margin:10px 0 4px">
      <input type="checkbox" id="schedSavePush" checked style="accent-color:var(--sun-purple);width:16px;height:16px">
      <span>📣 推送给参与者「行程有更新」</span>
    </label>
    <input id="schedSaveNote" placeholder="可选：补充说明" value="${esc(it.note||'')}" style="width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;box-sizing:border-box;margin-bottom:8px">
    <button class="btn" onclick="saveSchedItem(${di},${ii})">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`);
  const chk=$("#schedSavePush"),note=$("#schedSaveNote");
  if(chk&&note){note.style.display="block";chk.onchange=()=>{note.style.display=chk.checked?"block":"none";};}
}
function saveSchedItem(di,ii){
  const before=beginOperation(["schedule"]),it=state.schedule[di].items[ii],wasBlank=!it.start&&!it.end&&!it.act;
  ['start','end','act'].forEach(k=>{it[k]=document.querySelector('[data-ik="'+k+'"]').value.trim();});
  const shouldPush=!!($("#schedSavePush")&&$("#schedSavePush").checked);
  const note=($("#schedSaveNote")&&$("#schedSaveNote").value||"").trim();
  it.note=note;
  if(!wasBlank){it.updatedAt=new Date().toISOString();}
  if(!it.itemId){it.itemId="si_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);}
  const dayLabel=state.schedule[di].week||state.schedule[di].date||("D"+(di+1));

function saveFormField(idx){

  }
  const field={id:idx===-1?"ff_"+Date.now()+"_"+Math.random().toString(36).slice(2,5):(_formBuf.fields[idx]&&_formBuf.fields[idx].id||"ff_"+Date.now()),label,type,placeholder,required,options,validation};

function saveNewForm(){

    state.notices=[{title:"📋 "+form.title,content:(form.description||"组织者发布了新的信息收集表单，请尽快填写。")+"【点击「同行信息-提交」Tab 填写】",time:new Date().toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false}).replace("T"," ").slice(0,16),author:"组织者",level:"重要",_formId:id,_type:"form"},...(state.notices||[])];

function saveEditedForm(){

function deleteForm(formId){
  const form=formById(formId);if(!form)return;

/* ========== 组织者汇总视图 ========== */
function openFormSummary(formId){
  const form=formById(formId);if(!form)return;
  const subs=(state.formSubmissions||[]).filter(s=>s.formId===formId);
  const submittedIds=new Set(subs.map(s=>s.userId));
  const total=state.people.length;
  const submitted=subs.length;
  const pending=state.people.filter(p=>!submittedIds.has(p._id));
  const pendingHtml=pending.length?pending.map(p=>`<span class="form-summary-name">${esc(displayName(p))}</span>`).join(""):`<span style="color:var(--sun-sub);font-size:12px">全员已提交 🎉</span>`;
  const subRows=subs.map(s=>{
    const person=state.people.find(p=>p._id===s.userId)||{};
    const vals=form.fields.map(f=>{
      const v=s.data&&s.data[f.id];
      if(f.type==="image"){
        if(!v)return "-";
        // 兼容单图对象{full,thumb}和多图数组
        const imgs=Array.isArray(v)?v:(v&&typeof v==="object"&&(v.full||v.thumb)?[v]:[]);
        if(!imgs.length)return "-";
        return imgs.map(img=>{const full=typeof img==="object"?(img.full||img.thumb):img;const thumb=typeof img==="object"?(img.thumb||img.full):img;return `<img src="${thumb}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:2px;cursor:pointer" onclick="openSummaryImgLightbox('${full.replace(/'/g,"\\'")}')" title="点击查看大图">`;}).join("");
      }
      if(f.type==="image_text"){
        if(!v)return "-";
        // 实际存储结构是 {imgs:[{full,thumb},...], text} 或纯字符串（旧数据）
        if(typeof v==="string") return esc(v)||"-";
        const imgs=v.imgs&&Array.isArray(v.imgs)?v.imgs:(v.img?(typeof v.img==="object"?[v.img]:[]):[]);
        const imgPart=imgs.map(img=>{const full=typeof img==="object"?(img.full||img.thumb):img;const thumb=typeof img==="object"?(img.thumb||img.full):img;return `<img src="${thumb}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:2px;cursor:pointer" onclick="openSummaryImgLightbox('${full.replace(/'/g,"\\'")}')" title="点击查看大图">`;}).join("");
        const txtPart=v.text?`<div style="font-size:12px;color:var(--sun-text);line-height:1.5;margin-top:${imgs.length?'4px':'0'};white-space:pre-wrap;word-break:break-word">${esc(v.text)}</div>`:"";
        return `<div style="display:flex;flex-direction:column;gap:0">${imgPart?`<div>${imgPart}</div>`:""}${txtPart}</div>`||"-";
      }
      if(f.type==="multiselect"){
        if(!v||!Array.isArray(v)||!v.length)return "-";
        return v.map(o=>`<span style="display:inline-block;padding:1px 7px;margin:1px 2px;background:var(--sun-purple-soft,#f0eaff);color:var(--sun-purple,#7c3aed);border-radius:20px;font-size:11px">${esc(o)}</span>`).join("");
      }
      return `<span style="white-space:pre-wrap;word-break:break-word">${esc(v||"-")}</span>`;
    }).join("</td><td>");
    return `<tr><td>${esc(displayName(person))}</td><td>${vals}</td></tr>`;
  }).join("");
  const thead=`<tr><th>姓名</th>${form.fields.map(f=>`<th>${esc(f.label)}</th>`).join("")}</tr>`;
  const inner=`
    <h3>📋 ${esc(form.title)} · 汇总</h3>
    <div class="form-summary-stats">
      <div class="form-summary-stat"><strong>${submitted}</strong><span>已提交</span></div>
      <div class="form-summary-stat pending"><strong>${total-submitted}</strong><span>未提交</span></div>

function exportFormCsv(formId){
  const form=formById(formId);if(!form)return;
  const subs=(state.formSubmissions||[]).filter(s=>s.formId===formId);
  const headers=["姓名",...form.fields.map(f=>f.label),"提交时间"];
  const rows=subs.map(s=>{
    const person=state.people.find(p=>p._id===s.userId)||{};
    return [displayName(person),...form.fields.map(f=>{const v=s.data&&s.data[f.id];if(f.type==="image"){if(!v)return "";const imgs=Array.isArray(v)?v:(v&&(v.full||v.thumb)?[v]:[]);return imgs.map((_,i)=>"[图片"+(i+1)+"]").join(" ");}if(f.type==="image_text")return v?([(v.imgs&&v.imgs.length?"[图片×"+v.imgs.length+"]":""),v.text||""].filter(Boolean).join(" ")||""):"";if(f.type==="multiselect")return Array.isArray(v)?v.join("、"):(v||"");return String(v||"");}),s.submittedAt||""];
  });
  const csv=[headers,...rows].map(r=>r.map(c=>'"'+String(c||"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=form.title+"_提交汇总.csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast("CSV 已导出");
}
async function exportFormZip(formId){
  if(typeof JSZip==="undefined"){toast("正在加载 ZIP 库，请稍后再试…");return;}
  const form=formById(formId);if(!form)return;
  toast("正在生成 ZIP，请稍候…");
  const subs=(state.formSubmissions||[]).filter(s=>s.formId===formId);
  const zip=new JSZip();
  // CSV（包含文字字段 + 图片路径占位）
  const headers=["姓名",...form.fields.map(f=>f.label),"提交时间"];
  const rows=subs.map(s=>{
    const person=state.people.find(p=>p._id===s.userId)||{};
    const name=displayName(person)||s.userId;
    return [name,...form.fields.map(f=>{
      const v=s.data&&s.data[f.id];
      if(f.type==="image"){if(!v)return "";const imgs=Array.isArray(v)?v:(v&&(v.full||v.thumb)?[v]:[]);return imgs.map((_,i)=>name+"_"+f.label+"_"+(i+1)+".jpg").join(" | ");}
      if(f.type==="image_text"){if(!v)return "";const imgs=v.imgs&&Array.isArray(v.imgs)?v.imgs:[];const paths=imgs.map((_,i)=>name+"_"+f.label+"_"+(i+1)+".jpg").join(" | ");return [paths,v.text||""].filter(Boolean).join(" | ");}
      if(f.type==="multiselect")return Array.isArray(v)?v.join("、"):(v||"");
      return String(v||"");
    }),s.submittedAt||""];
  });
  const csv=[headers,...rows].map(r=>r.map(c=>'"'+String(c||"").replace(/"/g,'""')+'"').join(",")).join("\n");
  zip.file(form.title+"_提交汇总.csv","\uFEFF"+csv);
  // 图片文件（base64 data URL → binary）
  const imgFolder=zip.folder("图片");
  const b64toU8=(b64)=>{const raw=atob(b64.split(",").pop());const u8=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);return u8;};
  let imgCount=0;
  for(const s of subs){
    const person=state.people.find(p=>p._id===s.userId)||{};
    const name=displayName(person)||s.userId;
    for(const f of form.fields){
      const v=s.data&&s.data[f.id];
      if(f.type==="image"&&v){
        const imgs=Array.isArray(v)?v:(v&&(v.full||v.thumb)?[v]:[]);
        imgs.forEach((img,i)=>{
          const src=typeof img==="object"?(img.full||img.thumb):img;
          if(src&&src.startsWith("data:")){try{imgFolder.file(name+"_"+f.label+"_"+(i+1)+".jpg",b64toU8(src));imgCount++;}catch(e){}}
        });
      }
      if(f.type==="image_text"&&v){
        const imgs=v.imgs&&Array.isArray(v.imgs)?v.imgs:[];
        imgs.forEach((img,i)=>{
          const src=typeof img==="object"?(img.full||img.thumb):img;
          if(src&&src.startsWith("data:")){try{imgFolder.file(name+"_"+f.label+"_"+(i+1)+".jpg",b64toU8(src));imgCount++;}catch(e){}}
        });
      }
    }
  }
  try{
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=form.title+"_导出.zip";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast("ZIP 已导出（含 "+imgCount+" 张图片）");
  }catch(e){toast("ZIP 生成失败："+e.message);}
}

function openRandomGrouping(){

function generateRandomGrouping(){
  if(!randomGroupingDraft)return;
  const value=Math.floor(Number($("#randomValue").value));
  if(!Number.isFinite(value)||value<1||value>state.people.length){toast("请输入 1 至 "+state.people.length+" 之间的数字");return;}
  const field=($("#randomField").value||"").trim();
  if(!field){toast("请填写分组维度名称");return;}
  const shuffled=state.people.slice();
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  const groupCount=value;
  const groups=Array.from({length:groupCount},()=>[]);
  shuffled.forEach((person,index)=>groups[index%groupCount].push(person));
  randomGroupingDraft.value=value;randomGroupingDraft.field=field;randomGroupingDraft.groups=groups;
  const preview=$("#randomPreview");
  if(preview)preview.innerHTML=`<div class="random-summary">已随机生成 ${groupCount} 组，共 ${shuffled.length} 人；人数差不超过 1 人。再次点击生成可重新洗牌。</div><div class="random-preview">`+groups.map((members,index)=>`<div class="random-preview-card"><strong>第${index+1}组 <span>${members.length}人</span></strong><p>${members.map(person=>esc(displayName(person))).join(" · ")}</p></div>`).join("")+`</div>`;
  const save=$("#saveRandomGroupsBtn");if(save)save.style.display="block";
}
function saveRandomGrouping(){
  if(!randomGroupingDraft||!randomGroupingDraft.groups.length){toast("请先生成随机结果");return;}
  const field=randomGroupingDraft.field;
  const assigned=state.people.filter(person=>valOf(person,field)).length;
  if(assigned&&!confirm("保存后将覆盖「"+field+"」中已有的 "+assigned+" 人分组，是否继续？"))return;
  const before=beginOperation(["people","groupFields"]);
  if(!state.groupFields)state.groupFields=(GROUP_FIELDS||[]).slice();
  if(!state.groupFields.includes(field))state.groupFields.push(field);
  randomGroupingDraft.groups.forEach((members,index)=>{const groupName="第"+(index+1)+"组";members.forEach(person=>{person[field]=groupName;});});
  ctx.groupIdx=state.groupFields.indexOf(field);
  recordOperation("group","保存了「"+field+"」随机分组",["people","groupFields"],before,false);
  persist();closeSheet();render();toast("随机分组结果已保存 ✅");

function saveDimRename(oldName){
  const nv=($("#dimname").value||"").trim();
  if(!nv){toast("名称不能为空");return;}
  if(nv===oldName){closeSheet();return;}
  if(state.groupFields.includes(nv)){toast("已存在同名维度");return;}
  const before=beginOperation(["people","groupFields"]);
  const i=state.groupFields.indexOf(oldName); if(i>=0) state.groupFields[i]=nv;
  // 把成员身上旧维度的值迁移到新维度名
  state.people.forEach(p=>{ if(p[oldName]!==undefined){ p[nv]=p[oldName]; delete p[oldName]; } });
  recordOperation("group","将分组维度「"+oldName+"」改为「"+nv+"」",["people","groupFields"],before,false);
  persist();closeSheet();render();toast("维度已改名 ✅");
}
function delGroupDim(name){
  const cnt=state.people.filter(p=>valOf(p,name)).length;
  confirmSheet('删除维度「'+name+'」？该维度下所有分组安排都会清空（涉及 '+cnt+' 人的该项分组，成员本身不会被删除）。',()=>{
    const before=beginOperation(["people","groupFields"]);
    const i=state.groupFields.indexOf(name); if(i>=0) state.groupFields.splice(i,1);
    state.people.forEach(p=>{ if(p[name]!==undefined) delete p[name]; });
    ctx.groupIdx=0;
    recordOperation("group","删除了分组维度「"+name+"」",["people","groupFields"],before,false);
    persist();render();toast("已删除维度「"+name+"」✅");
  });
}
/* ---- 在某维度下新增一个分组（组） ---- */
function addGroupCat(field){
  const inner=`<h3>➕ 在「${esc(field)}」下新增分组</h3>
    <div class="f-item"><label>分组名称</label><input id="newcat" placeholder="如：1号房 / 第一小队"></div>
    <div class="hint">创建后可在该组卡片点「调整成员」把人加进来。</div>
    <button class="btn" onclick="saveNewCat('${esc(field)}')">创建</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  showSheet(inner);
}
function saveNewCat(field){
  const v=($("#newcat").value||"").trim();
  if(!v){toast("请填写分组名称");return;}
  if(v==="未分组"){toast("请换一个名称");return;}
  if(state.people.some(p=>(valOf(p,field)||"未分组")===v)){toast("该组已存在");return;}
  closeSheet();
  editGroupMembers(field,v); // 直接进入"调整成员"把人加入新组
}
function editGroup(idx){
  const p=state.people[idx];
  const f=(k,label)=>`<div class="f-item"><label>${label}</label><input data-gk="${k}" value="${esc(valOf(p,k))}"></div>`;
  const inner=`<h3>调整分组：${esc(displayName(p))}</h3>`+
    GF().map(k=>f(k,k)).join("")+
    `<button class="btn" onclick="saveGroup(${idx})">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  showSheet(inner);
}
function saveGroup(idx){
  const before=beginOperation(["people"]),o=state.people[idx];
  document.querySelectorAll('[data-gk]').forEach(el=>{o[el.dataset.gk]=el.value.trim();});
  recordOperation("group","调整了 "+displayName(o)+" 的分组",["people"],before,false);
  persist();closeSheet();render();
}
function editGroupMembers(field, groupName){
  const inner=`<h3>调整分组：「${esc(groupName)}」</h3>
    <div class="hint">点击下方成员可加入 / 移出本分组（高亮=已在本组）。改名请在下方输入后点保存。</div>
    <div class="mtwrap" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">`+
    state.people.map((p,idx)=>{
       const inG=(valOf(p,field)||"未分组")===groupName;
       return `<span class="mtoggle ${inG?'on':''}" data-pidx="${idx}" data-field="${esc(field)}" data-group="${esc(groupName)}" style="padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:14px;cursor:pointer;${inG?'background:var(--brand);color:#fff;border-color:var(--brand)':''}">${esc(displayName(p))}</span>`;
    }).join("")+`</div>
    <div class="f-item" style="margin-top:4px"><label>改名此分组（可选）</label><input data-gcn3 value="${esc(groupName)}"></div>
    <button class="btn sm" onclick="saveGroupRename('${esc(field)}','${esc(groupName)}')">保存改名</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="closeSheet()">完成</button>`;
  showSheet(inner);
  document.querySelectorAll('.mtoggle').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.pidx, f=b.dataset.field, g=b.dataset.group;
    const before=beginOperation(["people"]),p=state.people[idx];
    if((valOf(p,f)||"未分组")===g){
      p[f]=""; b.classList.remove('on'); b.style.background='';b.style.color='';b.style.borderColor='';
    } else {
      p[f]=g; b.classList.add('on'); b.style.background='var(--brand)';b.style.color='#fff';b.style.borderColor='var(--brand)';
    }
    recordOperation("group","调整了 "+displayName(p)+" 的「"+f+"」",["people"],before,false);
    persist();
  });
}
function saveGroupRename(field, oldName){
  const el=document.querySelector('[data-gcn3]'); if(!el)return;
  const nv=el.value.trim(); if(!nv){toast("名称不能为空");return;}
  const before=beginOperation(["people"]);
  if(nv!==oldName) state.people.forEach(p=>{if((valOf(p,field)||"未分组")===oldName)p[field]=nv;});
  recordOperation("group","将「"+field+"」分组「"+oldName+"」改为「"+nv+"」",["people"],before,false);
  persist();closeSheet();render();toast("已更新分组 ✅");
}
function delGroupCat(field,oldName){
  const cnt=state.people.filter(p=>(valOf(p,field)||"未分组")===oldName).length;
  confirmSheet('删除分组「'+oldName+'」？该组 '+cnt+' 人将回到「未分组」（成员本身不会被删除）。',()=>{
    const before=beginOperation(["people"]);
    state.people.forEach(p=>{if((valOf(p,field)||"未分组")===oldName)p[field]="";});
    recordOperation("group","删除了「"+field+"」分组「"+oldName+"」",["people"],before,false);
    persist();render();toast("已删除该分组 ✅");
  });
}

/* ============== 资讯（公告 + 贴士 合并呈现） ============== */
function noticeTone(n){
  const title=String((n&&n.title)||"");
  return /天气|着装|物品/.test(title)?"notice-life":"";
}
function tipTone(t){
  const title=String((t&&t.title)||"");
  if(/领队|联系/.test(title)) return "tip-purple";
  if(/气温|着装|物品/.test(title)) return "tip-pink";
  if(/高反|自驾/.test(title)) return "tip-blue";
  return "tip-green";
}
function infoView(){
  const isAdmin=ctx.role==="admin";
  if(ctx.infoTab==null) ctx.infoTab=0;
  const showInteract=anyInteractionEnabled();
  if(!showInteract&&ctx.infoTab===1)ctx.infoTab=0;

  // —— Tab 栏（公告 / 互动）——（贴士已移至行程页）
  const voteCount=interactionEnabled("vote")?(state.polls||[]).filter(p=>!p.deletedAt).length:0;
  const taskCount=interactionEnabled("taskCheckin")?(state.checkinTasks||[]).filter(t=>!t.deletedAt).length:0;
  const interactCount=voteCount+taskCount;
  const tabs = `<div class="info-tabs">
    <button class="info-tab ${ctx.infoTab===0?'on':''}" onclick="goInfoTab(0)">公告 <small>${(state.notices||[]).length + voteCount + taskCount}条</small></button>
    ${showInteract?`<button class="info-tab ${ctx.infoTab===1?'on':''}" onclick="goInfoTab(1)">互动 <small>${interactCount}项</small></button>`:""}
  </div>`;

  // —— 公告内容 ——
  // 将投票和打卡任务作为公告卡片混入公告流（按创建时间排序）
  function buildNoticeItems(){
    const items=[];
    // 普通公告
    (state.notices||[]).forEach((n,i)=>{
      items.push({kind:"notice",data:n,idx:i,time:Date.parse(n.time||"0")||0});
    });
    // 投票（有效的，且投票功能已开启）
    if(interactionEnabled("vote")) (state.polls||[]).filter(p=>!p.deletedAt).forEach(p=>{
      items.push({kind:"vote",data:p,time:Date.parse(p.createdAt||"0")||0});
    });
    // 打卡任务（有效的，且打卡功能已开启）
    if(interactionEnabled("taskCheckin")) (state.checkinTasks||[]).filter(t=>!t.deletedAt).forEach(t=>{
      items.push({kind:"task",data:t,time:Date.parse(t.createdAt||"0")||0});
    });
    // 信息收集表单（有效的，且提交功能已开启）
    if(formsEnabled()) (state.forms||[]).filter(f=>!f.deletedAt).forEach(f=>{
      items.push({kind:"form",data:f,time:Date.parse(f.createdAt||"0")||0});
    });
    // 按时间倒序（最新在前）
    items.sort((a,b)=>b.time-a.time);
    return items;
  }
  function renderNoticeItem(item){
    if(item.kind==="notice"){
      const n=item.data,i=item.idx;
      if(isAdmin){
        return `<div class="nt ${noticeTone(n)}"><div class="th">${n.level==="重要"?`<span class="badge-u">重要</span>`:""}${esc(n.title)}</div>
         <div class="ct">${esc(n.content)}</div><div class="mt">${esc(n.author)} · ${esc(n.time)}</div>
         <div style="margin-top:8px"><button class="mini" onclick="editNotice(${i})">改</button> <button class="mini del" onclick="delNotice(${i})">删</button></div></div>`;
      } else {
        return `<div class="nt ${noticeTone(n)}"><div class="th">${n.level==="重要"?`<span class="badge-u">重要</span>`:""}${esc(n.title)}</div>
        <div class="ct">${esc(n.content)}</div><div class="mt">${esc(n.author)} · ${esc(n.time)}</div></div>`;
      }
    }
    if(item.kind==="vote"){
      const p=item.data;
      const optionsHtml=p.options.map(o=>`<div class="interact-notice-opt">· ${esc(o.text)}</div>`).join("");
      const deadlineHtml=p.deadline?`<span class="interact-notice-deadline">截止：${esc(p.deadline)}</span>`:"";
      const typeLabel=p.type==="multiple"?"多选投票":"单选投票";
      const dest=isAdmin?'voteAdmin':'voteMember';
      const adminBtn=isAdmin?`<button class="mini" onclick="go('${dest}')" style="margin-left:6px">管理</button>`:"";
      const voteMe=!isAdmin?findMe():null;
      const voteDone=voteMe&&!!myPollBallot(p.id);
      const voteStatusBadge=!isAdmin?(voteDone?`<span class="interact-notice-tag" style="background:var(--sun-green);color:#fff">已完成</span>`:`<span class="interact-notice-tag" style="background:var(--sun-pink);color:#fff">待完成</span>`):"";
      return `<div class="nt interact-notice-vote" style="display:flex;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="th"><span class="interact-notice-tag vote-tag">投票</span>${esc(p.question)}</div>
          <div class="interact-notice-opts">${optionsHtml}</div>
          <div class="mt"><span>${typeLabel} · 组织者发起${deadlineHtml?` · `+deadlineHtml:""}</span></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex:none;gap:6px">
          ${voteStatusBadge||"<span></span>"}
          <div>${isAdmin ? adminBtn : `<button class="mini interact-notice-go" onclick="ctx.interactionFrom='notice';go('${dest}')">去参与</button>`}</div>
        </div>
      </div>`;
    }
    if(item.kind==="task"){
      const t=item.data;
      const descHtml=t.description?`<div class="ct">${esc(t.description)}</div>`:"";
      const deadlineHtml=t.deadline?`<span class="interact-notice-deadline">截止：${esc(t.deadline)}</span>`:"";
      const imgLabel=t.imageRequired?"需上传照片":"可附照片";
      const dest=isAdmin?'taskAdmin':'taskMember';
      const adminBtn=isAdmin?`<button class="mini" onclick="go('${dest}')" style="margin-left:6px">管理</button>`:"";
      const taskMe=!isAdmin?findMe():null;
      const taskDone=taskMe&&!!myCheckinSubmission(t.id);
      const taskStatusBadge=!isAdmin?(taskDone?`<span class="interact-notice-tag" style="background:var(--sun-green);color:#fff">已完成</span>`:`<span class="interact-notice-tag" style="background:var(--sun-pink);color:#fff">待完成</span>`):"";
      return `<div class="nt interact-notice-task" style="display:flex;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="th"><span class="interact-notice-tag task-tag">打卡</span>${esc(t.title)}</div>
          ${descHtml}
          <div class="mt"><span>${imgLabel} · 组织者发布${deadlineHtml?` · `+deadlineHtml:""}</span></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex:none;gap:6px">
          ${taskStatusBadge||"<span></span>"}
          <div>${isAdmin ? adminBtn : `<button class="mini interact-notice-go" onclick="ctx.interactionFrom='notice';go('${dest}')">去打卡</button>`}</div>
        </div>
      </div>`;
    }
    if(item.kind==="form"){
      const f=item.data;
      const me=findMe();
      const sub=me&&!isAdmin?formSubmissionByUser(f.id,me._id):null;
      const statusBadge=sub&&!sub.isDraft?`<span class="interact-notice-tag" style="background:#80c977;color:#fff">已提交</span>`:sub&&sub.isDraft?`<span class="interact-notice-tag" style="background:#f0a058;color:#fff">草稿</span>`:isAdmin?"":`<span class="interact-notice-tag" style="background:var(--sun-pink);color:#fff">待填写</span>`;
      const fieldCount=f.fields?f.fields.length:0;
      const adminBtn=isAdmin?`<button class="mini" onclick="ctx.groupsSubTab='submissions';go('groups')" style="margin-left:6px">管理</button>`:"";
      const memberBtn=!isAdmin?`<button class="mini interact-notice-go" onclick="go('formFill_${esc(f.id)}')">${sub&&!sub.isDraft?'查看/修改':sub&&sub.isDraft?'继续填写':'去填写'}</button>`:"";
      return `<div class="nt interact-notice-form">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div class="th"><span class="interact-notice-tag form-tag">表单</span>${esc(f.title)}</div>
            ${f.description?`<div class="ct">${esc(f.description)}</div>`:""}
            <div class="mt"><span>${fieldCount}个字段 · 组织者发布</span></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex:none;gap:6px">
            ${statusBadge||"<span></span>"}
            <div>${isAdmin ? adminBtn : memberBtn}</div>
          </div>
        </div></div>`;
    }
    return "";
  }
  const noticeItems=buildNoticeItems();
  let noticeHtml;
  if(!noticeItems.length){
    noticeHtml = isAdmin
      ? `<div class="empty-note">暂无公告或互动内容</div><button class="btn" onclick="editNotice(-1)">+ 发布公告</button>`
      : `<div class="empty-note">暂无公告或互动内容</div>`;
  } else {
    noticeHtml = noticeItems.map(renderNoticeItem).join("");
    if(isAdmin) noticeHtml += `<button class="btn" onclick="editNotice(-1)" style="margin-top:4px">+ 发布公告</button>`;
  }

  // —— 互动内容（嵌入资讯页，Tab=1）——
  let interactHtml = "";
  if(ctx.infoTab===1){
    const voteEnabled=interactionEnabled("vote"),taskEnabled=interactionEnabled("taskCheckin");
    if(!voteEnabled&&!taskEnabled){
      interactHtml=`<div class="empty-note">互动功能暂未开放</div>`;
    } else {
      const voteIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="m9 10 2 2 4-5M9 16h6"/></svg>`;
      const taskIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M8 13l2 2 5-5"/></svg>`;
      const pollCount=(state.polls||[]).filter(p=>!p.deletedAt).length;
      const taskCount=(state.checkinTasks||[]).filter(t=>!t.deletedAt).length;
      const voteDest=isAdmin?'voteAdmin':'voteMember';
      const taskDest=isAdmin?'taskAdmin':'taskMember';
      const voteBadge=pollCount>0?`<span class="interact-entry-badge">${pollCount}</span>`:"";
      const taskBadge=taskCount>0?`<span class="interact-entry-badge">${taskCount}</span>`:"";
      const voteBtn=voteEnabled?`<button class="interaction-action" onclick="ctx.interactionFrom='interaction';go('${voteDest}')">${voteIcon}投票${voteBadge}</button>`:"";
      const taskBtn=taskEnabled?`<button class="interaction-action" onclick="ctx.interactionFrom='interaction';go('${taskDest}')">${taskIcon}任务打卡${taskBadge}</button>`:"";
      interactHtml=`<section class="interaction-card"><div class="interaction-head"><strong>互动</strong><span>一起参与，轻松留念</span></div><div class="interaction-actions">${voteBtn}${taskBtn}</div></section>`;
    }
  }

  return `<div class="info-page">${tabs}${ctx.infoTab===0 ? noticeHtml : interactHtml}</div>`;
}
function goInfoTab(i){if(i===1&&!anyInteractionEnabled())i=0;ctx.infoTab=i;render();}
function editNotice(idx){
  const isNew=idx<0;
  const n=isNew?{title:'',content:'',time:new Date().toLocaleString('zh-CN'),author:'组织者',level:'普通'}:state.notices[idx];
  const inner=`<h3>${isNew?'发布公告':'编辑公告'}</h3>
    <div class="f-item"><label>标题</label><input data-nk="title" value="${esc(n.title||'')}"></div>
    <div class="f-item"><label>内容</label><input data-nk="content" value="${esc(n.content||'')}"></div>
    <div class="f-item"><label>重要级别</label><select data-nk="level">${['普通','重要'].map(l=>`<option ${l===(n.level||'普通')?'selected':''}>${l}</option>`).join('')}</select></div>
    <label class="push-check-row"><input type="checkbox" id="noticePushCheck" checked><span>📣 推送给参与者</span></label>
    <button class="btn" onclick="saveNotice(${idx})">保存</button><div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  showSheet(inner);
}
function saveNotice(idx){
  const before=beginOperation(["notices"]),isNew=idx<0,o=isNew?{}:state.notices[idx];
  const shouldPush=!!(document.getElementById("noticePushCheck")&&document.getElementById("noticePushCheck").checked);
  document.querySelectorAll('[data-nk]').forEach(el=>{o[el.dataset.nk]=el.value.trim();});
  if(isNew){o.time=new Date().toLocaleString('zh-CN');o.author='组织者';state.notices.unshift(o);}
  recordOperation("notice",(isNew?"发布了公告「":"修改了公告「")+o.title+"」",["notices"],before,false);
  if(shouldPush&&o.title){addPushNotice({module:"公告",action:isNew?"发布":"修改",title:o.title,body:o.content||"",publisher:"组织者"});}
  persist();closeSheet();render();
}
function delNotice(idx){confirmSheet('确定删除该公告？',()=>{const title=state.notices[idx]?state.notices[idx].title:"公告",before=beginOperation(["notices"]);state.notices.splice(idx,1);recordOperation("notice","删除了公告「"+title+"」",["notices"],before,false);persist();render();});}

function adminTable(){
  const flds=state.fields.filter(f=>f.key!==NAME_FIELD);
  const total=state.people.length;
  let head=`<th class="name-col">${esc(NAME_FIELD||"姓名")}</th>`+flds.map(f=>`<th>${esc(f.label)}</th>`).join("")+`<th>操作</th>`;
  let rows=state.people.map((p,idx)=>{
    let tds=`<td class="name-col">${esc(displayName(p))}</td>`;
    flds.forEach(f=>{
      let v=valOf(p,f.key);
      if(f.sensitive) v = (f.key.indexOf("手机")>=0||f.key.indexOf("电话")>=0)?maskPhone(v):(v?"已加密":"");
      tds+=`<td title="${esc(v)}">${v?esc(v):'<span style="color:#cbd5e1">—</span>'}</td>`;
    });
    tds+=`<td><button class="mini" onclick="editPerson(${idx})">改</button> <button class="mini del" onclick="delPerson(${idx})">删</button></td>`;
    return `<tr>${tds}</tr>`;
  }).join("");
  const syncHint = SYNC_ENABLED ? "" : `<div class="hint sync-hint-mini">⚠️ 本小程序未配置同步后台，数据仅保存在本机。</div>`;
  return `<div class="admin-page">
    <div class="admin-top-row"><div class="admin-summary"><div class="stat"><div class="num">${total}</div><div class="lb">总人数</div></div></div>${operationEntry()}</div>
    <div class="card admin-notif-card"><div class="admin-notif-card-head"><span>📣 推送通知记录</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:var(--sun-muted)">按最新排列</span><label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:${notificationEnabled()?'var(--sun-purple)':'var(--sun-muted)'}"><input type="checkbox" ${notificationEnabled()?'checked':''} onchange="toggleNotification(this.checked)" style="accent-color:var(--sun-purple);width:13px;height:13px">${notificationEnabled()?'推送已开启':'推送已关闭'}</label></div></div>${adminNotifLog()}</div>
    <div class="admin-section-title">成员管理</div>
    <div class="admin-toolbar"><button class="btn" onclick="editPerson(-1)">新增人员</button><button class="btn ghost" onclick="importPeopleDialog()">批量导入</button></div>
    ${syncHint}
    <div class="tbl-wrap tbl-wrap-sticky"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function importPeopleDialog(){
  const inner=`<h3>批量导入人员</h3>
    <div class="hint" style="margin-bottom:10px">从 Excel 选中要导入的整块区域（含表头行）直接复制，然后粘贴到下方框里。第一行会被当作表头，用于自动匹配字段（如"姓名"会自动对应"中文名"）。</div>
    <div class="f-item"><textarea id="importRaw" rows="10" placeholder="例如：\n中文名\t部门/中心\t常驻城市\n张三\t产品部\t深圳\n李四\t技术部\t北京" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical"></textarea></div>
    <button class="btn" onclick="parseImportPreview()">下一步：预览</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  showSheet(inner);
}
// 简单CSV/TSV行拆分：优先按Tab分，没有Tab再按逗号分（兼容中英文逗号）
function splitImportLine(line){
  if(line.indexOf("\t")>=0) return line.split("\t").map(s=>s.trim());
  return line.split(/,|，/).map(s=>s.trim());
}
// 归一化字符串用于字段名匹配（去空格/斜杠/括号等，忽略大小写）
function normalizeFieldName(s){
  return String(s||"").toLowerCase().replace(/[\s/()（）\-_]/g,"");
}
// 别名表：常见口语化表头 -> 字段key（在精确/包含匹配失败时兜底）
const IMPORT_FIELD_ALIASES = {
  "姓名":"中文名","名字":"中文名","真实姓名":"中文名",
  "部门":"部门/中心","中心":"部门/中心",
  "城市":"常驻城市","所在城市":"常驻城市",
  "手机":"手机号","电话":"手机号","联系方式":"手机号",
  "身份证":"身份证号","证件号":"身份证号"
};
// 根据表头行，为每一列匹配到 state.fields 中的字段key（匹配不到则为null）
function matchImportHeaders(headerCells){
  const flds=state.fields;
  return headerCells.map(h=>{
    const norm=normalizeFieldName(h);
    if(!norm) return null;
    let hit=flds.find(f=>normalizeFieldName(f.label)===norm || normalizeFieldName(f.key)===norm);
    if(hit) return hit.key;
    hit=flds.find(f=>normalizeFieldName(f.label).indexOf(norm)>=0 || norm.indexOf(normalizeFieldName(f.label))>=0);
    if(hit) return hit.key;
    const aliasTarget=IMPORT_FIELD_ALIASES[String(h||"").trim()];
    if(aliasTarget && flds.some(f=>f.key===aliasTarget)) return aliasTarget;
    return null;
  });
}
// 第二步：解析并预览
function parseImportPreview(){
  const raw=($("#importRaw")&&$("#importRaw").value)||"";
  const lines=raw.split(/\r?\n/).map(l=>l).filter(l=>l.trim()!=="");
  if(lines.length<2){toast("请粘贴至少包含表头和一行数据的表格内容");return;}
  const headerCells=splitImportLine(lines[0]);
  const matchedKeys=matchImportHeaders(headerCells);
  const dataLines=lines.slice(1);
  const parsedRows=dataLines.map(l=>splitImportLine(l));
  window._importCtx={matchedKeys,headerCells,parsedRows};
  const matchedCount=matchedKeys.filter(Boolean).length;
  let head=`<th>#</th>`+headerCells.map((h,i)=>`<th>${esc(h||("列"+(i+1)))}${matchedKeys[i]?`<div style="font-size:10px;color:var(--sun-blue-deep);font-weight:400">→ ${esc((state.fields.find(f=>f.key===matchedKeys[i])||{}).label||"")}</div>`:`<div style="font-size:10px;color:#a84970;font-weight:400">未匹配，将忽略</div>`}</th>`).join("");
  let rows=parsedRows.map((cells,ri)=>{
    let tds=`<td>${ri+1}</td>`+headerCells.map((h,i)=>`<td>${esc(cells[i]||"")}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  const warnHint = matchedCount===0
    ? `<div class="hint" style="border-color:#f8d5e1;background:var(--sun-pink-soft);color:#a84970">没有任何列被匹配到已有字段，请检查表头名称，或返回修改后重试。</div>`
    : `<div class="hint">共识别 ${parsedRows.length} 行数据，成功匹配 ${matchedCount}/${headerCells.length} 列。未匹配的列不会被导入，可返回调整表头名称后重新粘贴。</div>`;
  const inner=`<h3>预览导入（${parsedRows.length} 人）</h3>
    ${warnHint}
    <div class="tbl-wrap" style="max-height:280px;overflow:auto;margin-bottom:12px"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <button class="btn" ${matchedCount===0?"disabled":""} onclick="commitImportPeople()">确认导入 ${parsedRows.length} 人</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="importPeopleDialog()">返回修改</button>`;
  showSheet(inner);
}
// 第三步：确认后批量写入 state.people
function commitImportPeople(){
  const ctx=window._importCtx;
  if(!ctx||!ctx.parsedRows||!ctx.parsedRows.length){toast("没有可导入的数据");return;}
  const before=beginOperation(["people"]);
  let added=0;
  ctx.parsedRows.forEach(cells=>{
    const obj=Object.fromEntries(state.fields.map(f=>[f.key,""]));
    let hasAny=false;
    ctx.matchedKeys.forEach((key,i)=>{
      if(key && cells[i]){obj[key]=cells[i].trim();hasAny=true;}
    });
    if(!hasAny) return;
    obj._id="new"+Date.now()+"_"+added;
    state.people.push(obj);
    added++;
  });
  recordOperation("member","批量导入了 "+added+" 名成员",["people"],before,true);
  persist();
  window._importCtx=null;
  closeSheet();
  toast("已成功导入 "+added+" 人");
}

function delPerson(idx){
  confirmSheet('确定删除 '+(displayName(state.people[idx])||"该人员")+'？',()=>{const name=displayName(state.people[idx]),before=beginOperation(["people"]);state.people.splice(idx,1);recordOperation("member","删除了成员「"+name+"」",["people"],before,true);persist();render();});
}
function editPerson(idx){
  const isNew = idx<0;
  const p = isNew ? Object.fromEntries(state.fields.map(f=>[f.key,""])) : state.people[idx];
  if(isNew) p._id="new"+Date.now();
  window._editIdx=idx; window._newObj=p;
  renderEditPersonSheet(idx);
}
// 渲染新增/编辑人员弹窗：顶部可展开的「管理填写项」面板 + 下方按当前字段定义生成的表单
function renderEditPersonSheet(idx){
  const isNew = idx<0;
  const p = isNew ? window._newObj : state.people[idx];
  const bymod={};
  state.fields.forEach(f=>{(bymod[f.module]=bymod[f.module]||[]).push(f);});
  const modOrder = (state.moduleOrder&&state.moduleOrder.length) ? state.moduleOrder : Object.keys(bymod);
  const fmOpen = !!window._fieldMgrOpen;
  let inner=`<h3>${isNew?"新增人员":"编辑："+esc(displayName(p))}</h3>
    <div class="field-mgr-toggle ${fmOpen?"on":""}" onclick="toggleFieldMgr(${idx})"><span>⚙️ 管理填写项（改名/删除/新增）</span><span class="arrow">▾</span></div>
    ${fmOpen?fieldMgrPanelHtml():""}`;
  modOrder.forEach(m=>{
    if(!bymod[m]||!bymod[m].length) return;
    inner+=`<div class="grpttl">${esc(m)}</div>`;
    bymod[m].forEach(f=>{
      inner+=`<div class="f-item"><label>${esc(f.label)}${f.sensitive?'<span class="sens-badge">敏感</span>':''}</label>
        <input data-ek="${f.key}" value="${esc(valOf(p,f.key))}"></div>`;
    });
  });
  inner+=`<button class="btn" onclick="savePerson(${idx})">保存</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">取消</button>`;
  const m=$("#mask");
  if(m){ m.querySelector(".sheet").innerHTML=inner; }   // 原地替换：保留滚动位置，删除模块/字段不再跳回顶部
  else { showSheet(inner); }
  if(fmOpen) bindFieldMgrDrag();
}
/* ============== 字段管理（组织者自定义"新增人员"表单的填写项） ==============
 * 入口：新增/编辑人员弹窗顶部「管理填写项」折叠面板，展开后可直接改名/删除/新增/拖拽排序，
 * 无需跳出当前表单；点「完成」收起面板并即时应用到下方表单。
 */
function toggleFieldMgr(idx){
  window._fieldMgrOpen = !window._fieldMgrOpen;
  if(window._fieldMgrOpen){
    window._fieldMgrConfirm = null;
    window._fieldsDraft = JSON.parse(JSON.stringify(state.fields));
    window._moduleOrderDraft = (state.moduleOrder&&state.moduleOrder.length) ? state.moduleOrder.slice() : Array.from(new Set(state.fields.map(f=>f.module)));
  }
  renderEditPersonSheet(idx);
}
function fieldMgrPanelHtml(){
  const flds=window._fieldsDraft;
  const modOrder=window._moduleOrderDraft;
  const c=window._fieldMgrConfirm;   // 当前待确认（内联到对应项位置，而非面板底部）
  const bymod={};
  flds.forEach((f,i)=>{(bymod[f.module]=bymod[f.module]||[]).push(i);});
  let html=`<div class="field-mgr-panel">
    <div class="hint" style="margin:0 0 10px">改名称、删「不需要的项」，或在下方新增自定义项；模块小标题同样可改名/整体删除。</div>`;
  modOrder.forEach((m,mi)=>{
    const idxs=bymod[m]||[];
    html+=`<div class="field-mgr-mod-head ${c&&c.type==="module"&&c.index===mi?"fm-pending":""}">
        <input class="field-mgr-mod-title" value="${esc(m)}" onchange="renameModuleDraft(${mi},this.value)">
        <button class="fm-op fm-del" title="删除整个模块" onclick="removeModuleDraft(${mi})">✕</button>
      </div>${ (c&&c.type==="module"&&c.index===mi)?fieldMgrConfirmHtml():"" }<div class="field-mgr-list" data-mod="${esc(m)}">`;
    if(!idxs.length){
      html+=`<div class="field-mgr-empty">该模块暂无填写项，可在下方添加</div>`;
    }
    idxs.forEach(i=>{
      const f=flds[i];
      const locked = f.key===NAME_FIELD;
      html+=`<div class="field-mgr-row ${c&&c.type==="field"&&c.index===i?"fm-pending":""}" draggable="${locked?"false":"true"}" data-fi="${i}">
        <span style="flex:0 0 auto;color:var(--sun-muted);cursor:${locked?"default":"grab"}">${locked?"":"⠿"}</span>
        <input value="${esc(f.label)}" ${locked?"disabled":""} onchange="renameFieldDraft(${i},this.value)">
        <div class="fm-ops">${locked?`<span style="font-size:10px;color:var(--sun-muted);white-space:nowrap;padding:0 4px">必留</span>`:`<button class="fm-op fm-del" title="删除" onclick="removeFieldDraft(${i})">✕</button>`}</div>
      </div>${ (c&&c.type==="field"&&c.index===i)?fieldMgrConfirmHtml():"" }`;
    });
    html+=`</div>`;
  });
  html+=`<div style="display:flex;gap:6px;margin-top:12px">
      <input id="newModuleName" placeholder="新增模块小标题，如：紧急联系" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--sun-border);border-radius:9px;font-size:13px">
      <button class="fm-op-add" onclick="addModuleDraft()">+ 新增模块</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input id="newFieldLabel" placeholder="新填写项名称，如：紧急联系人" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--sun-border);border-radius:9px;font-size:13px">
      <select id="newFieldModule" style="flex:0 0 auto;padding:8px 6px;border:1px solid var(--sun-border);border-radius:9px;font-size:12px;background:#fff">${modOrder.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("")}</select>
    </div>
    <button class="field-mgr-addbtn" onclick="addFieldDraft()">+ 添加此项</button>
    <button class="btn" style="margin-top:10px" onclick="saveFieldsDraft(${window._editIdx})">完成，应用改动</button>
  </div>`;
  return html;
}
function fieldMgrConfirmHtml(){
  const c=window._fieldMgrConfirm;
  if(!c) return "";
  let msg="";
  if(c.type==="field"){
    msg="确定删除该填写项？已填写的数据不会再显示，但不会真正抹除。";
  }else if(c.type==="module"){
    const m=window._moduleOrderDraft[c.index];
    const cnt=window._fieldsDraft.filter(f=>f.module===m).length;
    msg = cnt? `确定删除模块「${esc(m)}」？其下 ${cnt} 个填写项将一并删除，已填写的数据不会再显示，但不会真正抹除。` : `确定删除模块「${esc(m)}」？`;
  }
  const yesFn = c.type==="field" ? "confirmRemoveFieldDraft()" : "confirmRemoveModuleDraft()";
  return `<div class="field-mgr-confirm">
    <div class="field-mgr-confirm-msg">${msg}</div>
    <div class="field-mgr-confirm-actions">
      <button class="fm-confirm-no" onclick="cancelFieldMgrConfirm()">取消</button>
      <button class="fm-confirm-yes" onclick="${yesFn}">确定</button>
    </div>
  </div>`;
}
function renameModuleDraft(mi,val){
  const name=val.trim();
  if(!name){renderEditPersonSheet(window._editIdx);return;}
  const old=window._moduleOrderDraft[mi];
  if(old===name) return;
  window._moduleOrderDraft[mi]=name;
  window._fieldsDraft.forEach(f=>{ if(f.module===old) f.module=name; });
  renderEditPersonSheet(window._editIdx);
}
function removeModuleDraft(mi){
  // 内联确认：仅更新草稿，不关闭弹窗，确认后仍停留在管理填写项面板
  window._fieldMgrConfirm = {type:"module", index:mi};
  renderEditPersonSheet(window._editIdx);
}
function confirmRemoveModuleDraft(){
  const c=window._fieldMgrConfirm;
  if(!c||c.type!=="module") return;
  const mi=c.index, m=window._moduleOrderDraft[mi];
  window._fieldsDraft = window._fieldsDraft.filter(f=>f.module!==m);
  window._moduleOrderDraft.splice(mi,1);
  window._fieldMgrConfirm=null;
  renderEditPersonSheet(window._editIdx);
}
function addModuleDraft(){
  const name=($("#newModuleName")&&$("#newModuleName").value||"").trim();
  if(!name){toast("请填写模块名称");return;}
  if(window._moduleOrderDraft.includes(name)){toast("已存在同名模块");return;}
  window._moduleOrderDraft.push(name);
  renderEditPersonSheet(window._editIdx);
}
function renameFieldDraft(i,val){
  window._fieldsDraft[i].label = val.trim() || window._fieldsDraft[i].label;
}
function removeFieldDraft(i){
  // 内联确认：仅更新草稿，不关闭弹窗，确认后仍停留在管理填写项面板
  window._fieldMgrConfirm = {type:"field", index:i};
  renderEditPersonSheet(window._editIdx);
}
function confirmRemoveFieldDraft(){
  const c=window._fieldMgrConfirm;
  if(!c||c.type!=="field") return;
  window._fieldsDraft.splice(c.index,1);
  window._fieldMgrConfirm=null;
  renderEditPersonSheet(window._editIdx);
}
function cancelFieldMgrConfirm(){
  window._fieldMgrConfirm=null;
  renderEditPersonSheet(window._editIdx);
}
function addFieldDraft(){
  const label=($("#newFieldLabel")&&$("#newFieldLabel").value||"").trim();
  const mod=($("#newFieldModule")&&$("#newFieldModule").value)||window._moduleOrderDraft[0];
  if(!label){toast("请填写填写项名称");return;}
  const key = label+"_"+Date.now().toString(36);
  window._fieldsDraft.push({key,label,module:mod,editor:"admin",type:"text",sensitive:false,options:[]});
  renderEditPersonSheet(window._editIdx);
}
// 拖拽排序：松手后按当前模块内DOM最终顺序，重建该模块下的字段顺序（其他模块的字段位置不变）
function bindFieldMgrDrag(){
  if(window._fieldMgrConfirm) return;   // 有删除确认待定时不绑拖拽，避免顺序错位
  document.querySelectorAll(".field-mgr-list").forEach(list=>{
    let dragEl=null;
    list.querySelectorAll(".field-mgr-row[draggable='true']").forEach(row=>{
      row.addEventListener("dragstart",()=>{dragEl=row;row.classList.add("dragging");});
      row.addEventListener("dragend",()=>{row.classList.remove("dragging");dragEl=null;reorderFieldsDraftByDom(list);});
      row.addEventListener("dragover",(e)=>{
        e.preventDefault();
        if(!dragEl||dragEl===row) return;
        const rect=row.getBoundingClientRect();
        const before=(e.clientY - rect.top) < rect.height/2;
        list.insertBefore(dragEl, before?row:row.nextSibling);
      });
    });
  });
}
// 根据某个模块列表最终的DOM行顺序（data-fi），把这批字段在 window._fieldsDraft 中按新顺序原地替换
function reorderFieldsDraftByDom(list){
  const orderedIdx=[...list.querySelectorAll(".field-mgr-row")].map(r=>parseInt(r.dataset.fi,10));
  const orderedFields=orderedIdx.map(i=>window._fieldsDraft[i]);
  const positions=orderedIdx.slice().sort((a,b)=>a-b);
  positions.forEach((pos,k)=>{window._fieldsDraft[pos]=orderedFields[k];});
}
function saveFieldsDraft(idx){
  const labels=window._fieldsDraft.map(f=>f.label.trim());
  if(labels.some(l=>!l)){toast("填写项名称不能为空");return;}
  if(!window._moduleOrderDraft.length){toast("至少保留一个模块");return;}
  // 同步补全人员对象上缺失的新字段key，避免下方表单读取undefined
  const applyToObj=(obj)=>{if(!obj)return;window._fieldsDraft.forEach(f=>{if(obj[f.key]===undefined) obj[f.key]="";});};
  applyToObj(window._newObj);
  state.people.forEach(applyToObj);
  state.fields = window._fieldsDraft;
  state.moduleOrder = window._moduleOrderDraft;
  window._fieldMgrOpen = false;
  persist();
  toast("填写项已更新");
  renderEditPersonSheet(idx);
}
function closeSheet(){window._fieldMgrOpen=false;const m=$("#mask");if(m){m.remove();}render();}
function showSheet(inner){
  const old=$("#mask");if(old)old.remove();
  const mask=document.createElement("div");mask.className="mask";mask.id="mask";
  mask.innerHTML=`<div class="sheet">${inner}</div>`;
  mask.addEventListener("click",(e)=>{if(e.target===mask)closeSheet();});
  document.body.appendChild(mask);
}

/* ============== 云同步设置（方案③：填一次生成"专属版"文件，之后彻底零弹窗） ============== */

      msg.innerHTML=`<div class="hint" style="color:#e05252;text-align:left">请填写「仓库」和「令牌」两项。</div>`;

let _cdLocked=false;
function confirmDialog(opts){
  _cdLocked=false;
  const title=opts.title||"请确认";
  const confirmText=opts.confirmText||"确定";
  const old=$("#mask");if(old)old.remove();
  const mask=document.createElement("div");mask.className="mask";mask.id="mask";
  mask.innerHTML=`<div class="sheet" id="cdSheet">
    <h3>${esc(title)}</h3>
    <div style="font-size:14px;margin:12px 0;color:#374151">${opts.msg||""}</div>
    ${opts.extraHtml||""}
    <button id="cdConfirmBtn" class="btn" style="margin-top:4px">${esc(confirmText)}</button>
    <div style="height:8px"></div>
    <button id="cdCancelBtn" class="btn ghost">取消</button>
  </div>`;
  // 事件委托：只在 mask 层监听，精准判断目标
  mask.addEventListener("click",async function handler(e){
    const t=e.target;
    if(t===mask){mask.remove();render();return;}
    if(t.id==="cdCancelBtn"||t.closest("#cdCancelBtn")){mask.remove();render();return;}
    if(t.id==="cdConfirmBtn"||t.closest("#cdConfirmBtn")){
      if(_cdLocked)return;
      _cdLocked=true;
      t.disabled=true;t.textContent="处理中…";
      // 读取 extraHtml 中的勾选值
      const pushEl=mask.querySelector("#cdPushCheck");
      const extraSnapshot={pushChecked:pushEl?pushEl.checked:false};
      try{
        const result=opts.onConfirm(extraSnapshot);
        if(result&&typeof result.then==="function") await result;
      }catch(err){
        console.error("[confirmDialog] onConfirm 执行出错:",err);
      }finally{
        _cdLocked=false;
        const m=$("#mask");if(m)m.remove();
        render();
      }
    }
  });
  document.body.appendChild(mask);
}

function isGitlab(){ return /git\.woa\.com/.test(SYNC_API_ROOT); }

// 统一的「读云端数据」，返回 { content(已解码对象), sha } ；失败抛错
async function syncRead(){
  if(isGitlab()){
    // 工蜂 / GitLab：GET /projects/{owner%2Frepo}/repository/files/{path}/raw?ref={branch}
    const proj=encodeURIComponent(SYNC_REPO);
    const u=SYNC_API_ROOT+"/projects/"+proj+"/repository/files/"+encodeURIComponent(SYNC_FILE)+"/raw?ref="+encodeURIComponent(SYNC_BRANCH);
    const ctrl=new AbortController(); const tid=setTimeout(()=>ctrl.abort(),8000);
    try{
      const r=await fetch(u,{headers:{"PRIVATE-TOKEN":GITHUB_SYNC_TOKEN},cache:"no-store",signal:ctrl.signal});
      if(!r.ok) throw new Error("读取云端失败 "+r.status);
      return { content: await r.json(), sha: null };
    }finally{ clearTimeout(tid); }
  }
  // GitHub：GET /repos/{repo}/contents/{file}?ref={branch}
  const d=await fetchJsonFrom(syncApiUrl(), { Authorization:"Bearer "+GITHUB_SYNC_TOKEN, Accept:"application/vnd.github+json" });
  return { content: decodeBase64Json(d.content), sha: d.sha };
}
// 统一的「写云端数据」，payload 为 JS 对象；github 需 sha（乐观锁），工蜂自动更新
async function syncWrite(payload, sha){
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  if(isGitlab()){
    const proj=encodeURIComponent(SYNC_REPO);
    const u=SYNC_API_ROOT+"/projects/"+proj+"/repository/files/"+encodeURIComponent(SYNC_FILE);
    const body={ branch:SYNC_BRANCH, content:content, encoding:"base64", commit_message:"sync: "+new Date().toLocaleString('zh-CN') };
    const r=await fetch(u,{method:"PUT",headers:{"PRIVATE-TOKEN":GITHUB_SYNC_TOKEN,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) throw new Error("工蜂返回 "+r.status+": "+(await r.text().catch(()=>"")).slice(0,200));
    return;
  }
  const body={message:"sync: "+new Date().toLocaleString('zh-CN'),content:content,branch:SYNC_BRANCH};
  if(sha)body.sha=sha;
  const wr=await fetch(syncApiUrl(),{method:"PUT",headers:{Authorization:"Bearer "+GITHUB_SYNC_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!wr.ok) throw new Error("GitHub API 返回 "+wr.status+": "+(await r.text().catch(()=>"")).slice(0,200));
}

function mergeSyncData(data){

    const localMap=new Map(state.people.map(p=>[p._id,p]));
    const cloudIds=new Set(data.people.map(p=>p._id));
    const result=[];
    // ① 云端里的人：本地改过的 → 保留本地(不被覆盖)；其余 → 用云端(补回敏感字段)
    data.people.forEach(p=>{
      if(state._edited && state._edited[p._id]){
        const local=localMap.get(p._id);
        result.push(local || p);
      }else{
        const local=localMap.get(p._id);
        if(local){ SENS_FIELDS.forEach(k=>{ if(!p[k] && local[k]) p[k]=local[k]; }); }
        result.push(p);
      }
    });
    // ② 本地新增、云端还没有的人(如组织者刚加的成员)：保留，避免被拉取冲掉
    state.people.forEach(p=>{ if(p && p._id && !cloudIds.has(p._id)) result.push(p); });
    state.people=result;
  }
  normalizeTestAccounts();
  // 仅当云端该板块确有内容时才覆盖，避免空数组把本地数据清空
  if(data.schedule && data.schedule.length) state.schedule=data.schedule;
  if(data.notices && data.notices.length) state.notices=data.notices;
  if(data.tips && data.tips.length) state.tips=data.tips;
  if(data.overview && data.overview.length) state.overview=data.overview;
  if(data.groupFields && data.groupFields.length) state.groupFields=data.groupFields;
  if(data.activityInfo && typeof data.activityInfo==="object") state.activityInfo=Object.assign({},state.activityInfo,data.activityInfo);
  if(data.weatherDest && Number.isFinite(data.weatherDest.lat) && Number.isFinite(data.weatherDest.lng)) state.weatherDest=data.weatherDest;
  state.operationLogs=mergeOperationLogs(state.operationLogs,data.operationLogs||[]);
  state.polls=mergePolls(state.polls,data.polls||[]);
  state.voteBallots=mergeVoteBallots(state.voteBallots,data.voteBallots||[]);
  state.checkinTasks=mergeCheckinTasks(state.checkinTasks,data.checkinTasks||[]);
  state.checkinSubmissions=mergeCheckinSubmissions(state.checkinSubmissions,data.checkinSubmissions||[]);
  state.pushNotices=mergePushNotices(state.pushNotices,data.pushNotices||[]);
  persist();
}

  renderSplash();
  if(SYNC_ENABLED){
    // 单链接自动同步：进入即拉取最新，后台定时刷新（组织者改完参与者自动更新）
    await silentSync();
    startAutoRefresh();
  } else if(params.get("s") === "1"){
    toast("该小程序未配置同步后台");
  }
  // 方案③：不再自动弹窗。是否弹设置框完全由组织者在「活动设置→云同步」主动点击决定。
  await tryEnterpriseIdentify();
}
document.addEventListener("click",event=>{
  const trigger=event.target.closest(".checkin-photo-open");
  if(trigger){openCheckinPhoto(trigger.dataset.submissionId,Number(trigger.dataset.photoIndex));return;}
  const box=event.target.closest("#checkin-lightbox");
  if(box&&(event.target===box||event.target.closest(".checkin-lightbox-close")))closeCheckinPhoto();
  const sbox=event.target.closest("#summary-img-lightbox");
  if(sbox&&(event.target===sbox||event.target.closest(".checkin-lightbox-close")))closeSummaryImgLightbox();
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeCheckinPhoto();closeSummaryImgLightbox();}});
function openSummaryImgLightbox(src){
  let lb=document.getElementById("summary-img-lightbox");
  if(!lb){
    lb=document.createElement("div");
    lb.id="summary-img-lightbox";
    lb.className="checkin-lightbox";
    lb.innerHTML=`<img id="summary-lb-img" src="" alt="图片预览"><button class="checkin-lightbox-close" onclick="closeSummaryImgLightbox()">×</button><div class="checkin-lightbox-tip">点击空白处或按 ESC 关闭</div>`;
    document.body.appendChild(lb);
  }
  lb.querySelector("#summary-lb-img").src=src;
  lb.hidden=false;
  document.body.style.overflow="hidden";
}
function closeSummaryImgLightbox(){
  const lb=document.getElementById("summary-img-lightbox");
  if(lb)lb.hidden=true;
  document.body.style.overflow="";
}
// 生成浮动光点（青蓝主题动态背景）
(function(){
  var pc=document.getElementById('particles');
  if(!pc) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  for(var i=0;i<16;i++){
    var p=document.createElement('div');
    p.className='particle';
    var size=2+Math.random()*4;
    p.style.width=size+'px';p.style.height=size+'px';
    p.style.left=(Math.random()*100)+'%';
    p.style.animationDelay=(-Math.random()*18)+'s';
    p.style.animationDuration=(12+Math.random()*10)+'s';
    pc.appendChild(p);
  }
})();
init();
</script>
</body>
</html>
