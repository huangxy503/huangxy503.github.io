<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>团建活动 · 同行助手</title>
<style>
:root{
  /* 主色：天蓝童话（浅粉蓝，透气愉悦） */
  --brand:#5a9fd4;--brand2:#4a8ac4;--brand-soft:#e3f0fb;
  /* 主操作色：珊瑚红（参考图的活力撞色） */
  --cta:#e86a6a;--cta-grad:linear-gradient(135deg,#f07a7a,#e86a6a);
  /* 辅助色（小面积碰撞，制造生机） */
  --ok:#4db89a;--okbg:#e4f7f1;        /* 薄荷绿：机酒/交通/已完成 */
  --purple:#7c6eb8;--purplebg:#f0ecf9;/* 淡靛紫：资讯/公告/贴士 */
  --warn:#e8a03d;--warnbg:#fdf5e6;    /* 杏黄：紧急/重要提醒 */
  --coral:#e86a6a;--coralbg:#fceeeF;  /* 珊瑚红：互动/社交/分组 */
  /* 中性色 */
  --bg:#dcebf6;--bg-grad:linear-gradient(175deg,#d4ebf5 0%,#e0f0fa 40%,#eaf5fc 70%,#f5fafd 100%);
  --card:#ffffff;--ink:#2c3e50;--sub:#6b7f94;--line:#d4e3ef;--line2:#e2eff8;
  --red:#e05555;--redbg:#fdecea;--lock:#e3f0fb;
  /* 林芝晴日 · 统一设计变量（逐页接入，不直接覆盖旧页面） */
  --sun-atmosphere:#e9f9d9;--sun-surface:#ffffff;--sun-blue:#3c9cc7;--sun-blue-deep:#24789d;--sun-blue-soft:#dff1f7;
  --sun-purple:#7e6bdd;--sun-purple-soft:#f0edff;--sun-pink:#f19abc;--sun-pink-soft:#fff0f6;--sun-green:#80c977;--sun-orange:#f1a06f;
  --sun-text:#27352e;--sun-sub:#66766c;--sun-muted:#979d98;--sun-border:#e4e8e3;
  --sun-radius-card:16px;--sun-radius-focus:22px;--sun-space:16px;--sun-border-thin:.5px solid var(--sun-border);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg-grad);position:relative;z-index:1;padding-bottom:64px}
/* 入口页：山野旅行杂志 */
.splash{position:fixed;inset:0;z-index:50;overflow-y:auto;background:#fff;color:var(--sun-text);padding:0;-webkit-overflow-scrolling:touch}
.ticket-splash{min-height:100dvh;background:#fff}
/* 第一部分：顶部品牌与标题 */
.mag-head{position:relative;z-index:2;padding:calc(max(18px, env(safe-area-inset-top)) + 6px) 22px 6px;background:#fff}
.mag-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mag-brand{font-size:12.5px;font-weight:700;letter-spacing:.2px;color:var(--sun-blue-deep)}
.mag-date{flex:none;display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;background:var(--sun-atmosphere);color:#3f6b2f;font-size:12px;font-weight:700;letter-spacing:.3px}
.mag-subtitle{margin-top:6px;font-size:12px;color:var(--sun-muted);letter-spacing:.2px}
.mag-title{margin-top:15px;font-size:29px;line-height:1.22;letter-spacing:.3px;color:var(--sun-text);font-weight:600}
/* 第二部分：林芝山野主视觉 */
.mag-hero{padding:14px 22px 6px;background:#fff}
.mag-hero-card{position:relative;width:100%;aspect-ratio:3/2;border-radius:24px;overflow:hidden;background:#EAF4FB}
.mag-hero-art{display:block;width:100%;height:100%}
/* 第三部分：身份选择 */
.mag-panel{position:relative;z-index:2;padding:16px 22px calc(28px + env(safe-area-inset-bottom));background:#fff}
.mag-panel-kicker{font-size:13px;color:var(--sun-blue-deep);font-weight:700;letter-spacing:.3px;margin-bottom:16px}
.mag-entry{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:16px 18px;margin:0 0 13px;border-radius:20px;border:1px solid transparent;cursor:pointer;outline:none;transition:transform .14s ease,filter .14s ease,background .14s ease;text-align:left;user-select:none;-webkit-user-select:none}
.mag-entry:active{transform:scale(.985);filter:brightness(.985)}
.mag-entry:focus-visible{outline:2px solid var(--sun-blue);outline-offset:3px}
.mag-member{background:var(--sun-blue-soft)}
.mag-organizer{background:var(--sun-purple-soft)}
.mag-entry-icon{flex:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff}
.mag-entry-icon svg{width:24px;height:24px}
.mag-entry-body{flex:1 1 auto;min-width:0}
.mag-entry-title{font-size:18px;line-height:1.25;font-weight:700;color:var(--sun-text)}
.mag-entry-desc{margin-top:4px;font-size:13px;line-height:1.4;color:var(--sun-sub)}
.mag-entry-arrow{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;opacity:.7}
.mag-entry-arrow svg{width:22px;height:22px}
.mag-inline{margin:0 0 12px}
.mag-foot{margin:10px 0 0;color:var(--sun-muted);font-size:12px;text-align:left}
.identity-note{padding:13px 14px;border:var(--sun-border-thin);border-radius:14px;background:#fff;color:var(--sun-sub);font-size:13px;line-height:1.6}
.identity-note strong{color:var(--sun-text)}
/* 内联容器（姓名选择 / 口令输入）沿用既有结构，仅覆盖边距 */
.ticket-splash .inline-member-picker{padding:14px;border:var(--sun-border-thin);border-radius:16px;background:#fff}
.ticket-splash .inline-choice-label{font-size:12px;color:var(--sun-sub);margin-bottom:9px}
.ticket-splash .pick-search{width:100%;padding:11px 13px;border-radius:12px;border:var(--sun-border-thin);background:#fff;color:var(--sun-text);font-size:14px;box-sizing:border-box}
.ticket-splash .pick-search::placeholder{color:var(--sun-muted)}
.ticket-splash .pick-list{max-height:190px;overflow:auto;margin-top:8px;background:#fff;border:var(--sun-border-thin);border-radius:12px;padding:2px}
.ticket-splash .mem-pick{padding:10px 12px;color:var(--sun-text);font-size:14px;border-radius:8px}
.ticket-splash .mem-pick:active{background:var(--sun-blue-soft)}
.ticket-splash .mem-pick.empty{color:var(--sun-muted);text-align:center;font-size:13px}
.ticket-splash #pwdbox .pwd{width:100%;margin:0 0 14px}
.ticket-splash #pwdbox .pwd input{border:var(--sun-border-thin);background:#fff;padding:12px;border-radius:12px;color:var(--sun-text);font-size:14px;text-align:left}
.ticket-splash #pwdbox .role-btn{width:100%;margin:10px 0 0;padding:11px;border:0;border-radius:999px;background:var(--sun-purple);color:#fff;box-shadow:none;text-align:center}
.ticket-splash #pwdbox .role-btn b{font-size:14px}
.ticket-splash #pwdbox .role-btn:active{transform:scale(.98)}
.mag-manual-link{margin:-2px 0 14px;text-align:center}
.mag-manual-link button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 20px;border-radius:999px;background:#fff;border:1px solid rgba(60,156,199,.36);color:var(--sun-blue-deep);font-size:13px;font-weight:700;font-family:inherit;box-shadow:0 4px 14px rgba(60,156,199,.08);user-select:none;-webkit-user-select:none}
.mag-manual-link button:active{transform:scale(.97);background:var(--sun-blue-soft)}
@media (max-height:640px){.mag-head{padding-top:calc(max(14px, env(safe-area-inset-top)) + 4px)}.mag-title{margin-top:11px;font-size:25px}.mag-hero{padding-top:10px}.mag-hero-card{aspect-ratio:16/10}.mag-entry{min-height:78px;padding:13px 16px;margin-bottom:11px}}
@media (prefers-reduced-motion:reduce){.mag-entry{transition:none}}
/* header */
.hd{position:sticky;top:0;background:linear-gradient(135deg,#5a9fd4,#7ab8e2);color:#fff;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 2px 14px rgba(90,159,212,.22)}
.hd .t{font-size:18px;font-weight:600;letter-spacing:.3px}
.hd .sw{font-size:12px;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;cursor:pointer;transition:background .2s}
.hd .sw:active{background:rgba(255,255,255,.32)}
/* page */
.page{padding:18px;position:relative}
.card{background:#ffffff;border:1px solid var(--line2);border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 3px 20px rgba(90,159,212,.07),0 1px 4px rgba(0,0,0,.03);transition:box-shadow .25s,transform .2s}
.card:active{box-shadow:0 8px 28px rgba(90,159,212,.12),0 2px 8px rgba(0,0,0,.05)}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.mod-tag{font-size:12px;padding:3px 10px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-weight:700;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2);gap:12px}
.row:last-child{border-bottom:none}
.row .k{color:#5a6b82;font-size:13px;font-weight:500;flex-shrink:0}
.row .v{font-weight:600;text-align:right;word-break:break-word;font-size:14px;color:var(--ink);line-height:1.45}
.row .v.empty{color:#cbd5e1;font-weight:400}
.lockicon{font-size:10px;color:var(--brand);background:var(--brand-soft);padding:1px 5px;border-radius:4px;margin-left:4px}
.big-name{font-size:22px;font-weight:700;margin-bottom:3px;letter-spacing:-.3px;color:var(--ink)}
.dept{color:#5a6b82;font-size:13px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.sync-mini-btn{position:absolute;top:10px;right:10px;background:#fff;border:1px solid var(--line2);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sync-mini-btn:active{background:var(--brand-soft);transform:scale(.9)}
/* 航班特殊排版 */
.flight-prefix{color:var(--sub);font-size:13px;font-weight:400;margin-right:4px}
.flight-seg{display:block;font-size:13px;line-height:1.6}
.row-flight .v{flex-direction:column;align-items:flex-start}
/* 住宿特殊排版 */
.hotel-mate{font-size:12px;color:#64748b;margin-top:2px}
.row-hotel .v{flex-direction:column;align-items:flex-start}
.btn{display:block;width:100%;background:var(--cta-grad);color:#fff;border:none;padding:14px;border-radius:20px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;box-shadow:0 4px 16px rgba(232,106,106,.3);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(232,106,106,.25)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:6px 14px;font-size:13px;display:inline-block;margin:0}
/* form */
.f-item{margin-bottom:14px}
.f-item label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.f-item input,.f-item select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.sheet textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;min-height:60px;font-family:inherit;margin-top:6px;box-sizing:border-box}
.f-note{font-size:11px;color:#94a3b8;margin-top:3px}
.sens-badge{font-size:10px;background:var(--redbg);color:var(--red);padding:1px 6px;border-radius:5px;margin-left:5px}
/* schedule · 林芝晴日明亮协调版（仅行程页） */
.schedule-page{--sch-blue:#3c9cc7;--sch-blue-deep:#24789d;--sch-blue-soft:#dff1f7;--sch-purple:#7e6bdd;--sch-purple-soft:#f0edff;--sch-pink:#f19abc;--sch-pink-soft:#fff0f6;--sch-green:#80c977;--sch-green-soft:#e6f7dc;--sch-orange:#f1a06f;--sch-text:#27352e;--sch-sub:#66766c;--sch-muted:#979d98;--sch-border:#e4e8e3;padding-bottom:4px;color:var(--sch-text)}
.schedule-page .route-summary{position:relative;overflow:hidden;margin:-74px 0 16px;min-height:144px;padding:18px;border:.5px solid var(--sch-border);border-radius:22px;background:#cdebf5}
.route-mountains{position:absolute;inset:auto 0 0;width:100%;height:100%;pointer-events:none}.route-copy{position:relative;z-index:1;max-width:73%;padding:14px 16px;border-radius:18px;background:#fff}
.route-title{font-size:16px;line-height:1.3;color:var(--sch-text);font-weight:700;letter-spacing:.1px}.route-subtitle{margin-top:7px;font-size:12px;line-height:1.55;color:#506158;font-weight:500}.route-km{display:inline-flex;margin-top:10px;padding:3px 8px;border-radius:999px;background:#fff0e8;color:#b15d30;font-size:11px;font-weight:700}
.route-toggle{position:absolute;right:18px;bottom:16px;z-index:2;display:inline-flex;align-items:center;padding:5px 9px;border:0;border-radius:999px;background:rgba(255,255,255,.82);color:#3c9cc7;font:inherit;font-size:11px;font-weight:700;cursor:pointer}.route-toggle::after{content:"›";margin-left:4px;font-size:16px;line-height:1}
.route-drawer{margin:-2px 0 16px;padding:5px 15px 9px;background:#fff;border:.5px solid var(--sch-border);border-radius:16px}.route-drawer-title{padding:10px 0 7px;font-size:12px;color:var(--sch-sub);font-weight:700}.route-stop{display:flex;gap:10px;padding:10px 0;border-top:.5px solid var(--sch-border);align-items:flex-start}.route-stop-day{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;height:23px;border-radius:9px;background:var(--sch-blue-soft);color:var(--sch-blue-deep);font-size:11px;font-weight:700}.route-stop-main{flex:1;min-width:0;font-size:12px;line-height:1.45;color:var(--sch-text)}.route-stop-km{flex:0 0 auto;font-size:11px;color:var(--sch-muted)}.route-stop-actions{display:flex;gap:6px;flex:0 0 auto;align-items:center;margin-left:2px}.route-stop-actions .mini{padding:3px 8px}.route-drawer-add{display:block;width:100%;margin-top:9px;padding:10px;border:1px dashed var(--sch-blue);border-radius:14px;background:var(--sch-blue-soft);color:var(--sch-blue-deep);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.sched-tip-wrap{padding-top:60px}.sched-main-tabs{display:flex;gap:8px;margin:0 0 16px}.sched-main-tab{flex:1;padding:10px 12px;border:.5px solid var(--sch-border);border-radius:14px;background:#fff;color:var(--sch-sub);font-size:14px;font-weight:600;text-align:center;cursor:pointer;transition:background .18s,color .18s,border-color .18s}.sched-main-tab small{font-size:11px;font-weight:400;margin-left:3px}.sched-main-tab.on{background:var(--sch-blue);border-color:var(--sch-blue);color:#fff}
.sched-tip-body{padding:0}.sched-tip-body .card{border:.5px solid var(--sch-border);border-radius:16px;box-shadow:none;padding:16px;margin-bottom:14px;background:#fff}.sched-tip-body .card h3{font-size:15px;color:var(--sch-text);margin:0 0 8px}.sched-tip-body .hint{background:var(--sch-green-soft);border:.5px solid #cfe9c9;border-radius:12px;padding:10px 14px;font-size:12px;color:#427c3e;margin-bottom:12px}.sched-tip-body .tip-cat{color:#427c3e;font-size:12px;font-weight:700;margin:10px 0 4px}.sched-tip-body .tip-item{border:.5px solid rgba(128,201,119,.28);border-radius:10px;padding:8px 10px;margin-bottom:6px}.sched-tip-body .ti-name{font-size:13px;color:var(--sch-text);font-weight:600}.sched-tip-body .ti-detail{font-size:12px;color:var(--sch-sub);margin-top:2px}.sched-tip-body .tip-sub{color:#427c3e;font-size:13px;font-weight:700;margin:10px 0 4px}.sched-tip-body .tip-body{color:var(--sch-sub);font-size:13px}.sched-tip-body .tip-bullet{color:var(--sch-green);margin-right:4px}.sched-tip-body .tip-p{margin:3px 0}
.sched-tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 18px;padding:2px;-webkit-overflow-scrolling:touch}.sched-tab{display:flex;align-items:center;justify-content:center;gap:5px;min-width:76px;padding:10px 8px;border:.5px solid var(--sch-border);border-radius:14px;background:#fff;color:var(--sch-sub);font-size:11px;cursor:pointer;flex-shrink:0;transition:background .18s,color .18s,border-color .18s}.sched-tab .sched-day{font-size:13px;font-weight:700;color:var(--sch-text)}.sched-tab .sched-date{font-size:11px}.sched-tab.on{background:var(--sch-blue);border-color:var(--sch-blue);color:#fff}.sched-tab.on .sched-day{color:#fff}
.schedule-section-head{display:flex;align-items:center;margin:0 0 12px}.schedule-section-head h2{margin:0;font-size:15px;line-height:1.3;color:var(--sch-text);font-weight:700}
.schedule-timeline{position:relative;margin:0;padding:0}.timeline-item{display:grid;grid-template-columns:48px 20px minmax(0,1fr);gap:9px;position:relative;min-height:80px}.timeline-time{padding-top:12px;font-size:11px;line-height:1;color:var(--sch-sub);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.timeline-rail{position:relative;display:flex;justify-content:center}.timeline-rail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:#d8ded9}.timeline-item:first-child .timeline-rail::before{top:20px}.timeline-item:last-child .timeline-rail::before{bottom:calc(100% - 20px)}.timeline-dot{position:relative;z-index:1;width:11px;height:11px;margin-top:12px;border:2px solid #fff;border-radius:50%;background:var(--sch-green);box-shadow:0 0 0 1px #b8dcb4}.timeline-item.kind-transport .timeline-dot{background:var(--sch-blue);box-shadow:0 0 0 1px #a9dbea}.timeline-item.kind-gathering .timeline-dot{background:var(--sch-purple);box-shadow:0 0 0 1px #c7bdf4}.timeline-item.kind-meal .timeline-dot,.timeline-item.kind-stay .timeline-dot{background:var(--sch-pink);box-shadow:0 0 0 1px #f7c8d9}.timeline-item.kind-activity .timeline-dot{background:var(--sch-green);box-shadow:0 0 0 1px #b8dcb4}
.timeline-card{min-width:0;margin-bottom:14px;padding:12px 13px;background:#fff;border:.5px solid var(--sch-border);border-radius:16px}.timeline-item.kind-gathering .timeline-card{background:var(--sch-purple-soft);border-color:#ded7ff}.timeline-item.kind-meal .timeline-card,.timeline-item.kind-stay .timeline-card{background:var(--sch-pink-soft);border-color:#f8d5e1}.timeline-item.kind-activity .timeline-card{background:var(--sch-green-soft);border-color:#cfe9c9}.timeline-event{font-size:13px;line-height:1.45;color:var(--sch-text);font-weight:700;word-break:break-word}.timeline-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.timeline-note{min-width:0;font-size:11px;line-height:1.4;color:var(--sch-sub);word-break:break-word}.event-tag{display:inline-flex;align-items:center;flex:0 0 auto;padding:3px 8px;border-radius:999px;font-size:11px;line-height:1.2;font-weight:700;background:rgba(255,255,255,.68)}.event-tag.transport{background:var(--sch-blue-soft);color:var(--sch-blue-deep)}.event-tag.gathering{background:#e6f7dc;color:#427c3e}.event-tag.meal,.event-tag.stay{background:#ffe1ed;color:#a84970}.event-tag.activity{background:rgba(255,255,255,.72);color:#427c3e}
.timeline-admin-actions{display:flex;gap:6px;margin-top:9px}.timeline-admin-actions .mini{padding:3px 8px}.schedule-admin-add{margin:0 0 14px;padding-left:77px}.schedule-admin-add .btn,.schedule-add-day{margin:0;background:var(--sch-blue);border-radius:20px;padding:10px;font-size:13px;box-shadow:none}.schedule-add-day{display:block;width:100%;margin-top:2px}.schedule-empty{padding:38px 18px;text-align:center;color:var(--sch-muted);font-size:13px;background:#fff;border:.5px solid var(--sch-border);border-radius:16px}.schedule-empty-title{font-size:16px;font-weight:700;color:var(--sch-text)}.schedule-empty-copy{margin-top:7px;font-size:12px;line-height:1.6}.schedule-empty-actions{display:flex;gap:8px;margin-top:20px}.schedule-empty-actions .btn{flex:1;margin:0;border-radius:18px;padding:10px 8px;font-size:12px}.schedule-empty-actions .ghost{background:#fff;color:var(--sch-blue-deep);border:1px solid var(--sch-blue)}.schedule-day-manage{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-7px 0 14px;padding:9px 11px;border:.5px solid var(--sch-border);border-radius:13px;background:#fff}.schedule-day-manage span{min-width:0;color:var(--sch-sub);font-size:12px}.schedule-day-manage-actions{display:flex;gap:6px;flex:0 0 auto}.schedule-day-manage .mini{padding:4px 9px}.schedule-timeline-empty{margin:0 0 14px;padding:22px 14px;border:1px dashed var(--sch-border);border-radius:14px;text-align:center;color:var(--sch-muted);font-size:12px}
.timeline-item-note{margin-top:7px;font-size:11px;line-height:1.5;color:var(--sch-sub);padding:5px 8px;background:rgba(255,255,255,.7);border-radius:8px;border-left:2px solid #d1d5db}
.timeline-item-note.admin-note{color:#7c5fc8;border-left-color:#c4b8f5;background:#f7f4ff}
@keyframes schedHighlight{0%{box-shadow:0 0 0 3px rgba(234,160,45,.65),0 4px 18px rgba(234,160,45,.3)}50%{box-shadow:0 0 0 5px rgba(234,160,45,.55),0 4px 22px rgba(234,160,45,.35)}100%{box-shadow:0 0 0 0 rgba(234,160,45,0),0 1px 4px rgba(0,0,0,.06)}}
.timeline-card.sched-highlight{animation:schedHighlight 2.2s ease-out both;background:#fffbef!important;border-color:#f0c04a!important}
#app.schedule-shell .tab.on{color:var(--sch-blue)}
/* notice */
.nt{background:#ffffff;border:1px solid var(--line2);border-radius:18px;padding:15px 18px;margin-bottom:13px;box-shadow:0 3px 20px rgba(90,159,212,.07),0 1px 4px rgba(0,0,0,.03)}
.nt .th{font-weight:600;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.badge-u{font-size:10px;background:var(--warn);color:#fff;padding:1px 8px;border-radius:5px;font-weight:600}
.nt .ct{font-size:13px;color:#374151;margin:6px 0;line-height:1.6}
.nt .mt{font-size:11px;color:var(--sub)}
/* 互动公告卡片（投票/打卡混入公告流） */
.interact-notice-vote{border-color:#d4caff;background:var(--purplebg)}
.interact-notice-task{border-color:#c2e9d4;background:var(--okbg)}
.interact-notice-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;flex-shrink:0}
.vote-tag{background:var(--purple);color:#fff}
.task-tag{background:var(--ok);color:#fff}
.interact-notice-opts{margin:6px 0 2px;display:flex;flex-direction:column;gap:3px}
.interact-notice-opt{font-size:12px;color:#4b5563;padding:0 2px}
.interact-notice-deadline{color:var(--warn);font-weight:600}
.interact-notice-go{background:var(--cta-grad);color:#fff;border:none;font-size:11px;padding:4px 11px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:0 2px 6px rgba(232,106,106,.22)}
/* 表单公告卡片 */
.interact-notice-form{border-color:#c3ddf0;background:var(--sun-blue-soft)}
.form-tag{background:var(--sun-blue);color:#fff}
/* 表单管理样式 */
.form-admin-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:14px 16px;background:linear-gradient(135deg,#fff5f9,#fff9f4);border:1px solid #f8d5e1;border-radius:16px}
.form-admin-header-text{display:flex;align-items:center;gap:10px;min-width:0}
.form-admin-header-icon{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 6px rgba(168,73,112,.12)}
.form-admin-header-text .fah-texts{display:flex;flex-direction:column;gap:2px;min-width:0}
.form-admin-header-text strong{font-size:16px;font-weight:800;color:var(--sun-text);line-height:1.3}
.form-admin-header-text span{font-size:12.5px;color:#a8687f;line-height:1.4}
.form-card{background:var(--sun-surface);border:var(--sun-border-thin);border-radius:var(--sun-radius-card);padding:16px;margin-bottom:12px}
.form-card.submitted{border-color:#80c977;background:#f3fbf0}
.form-card.draft{border-color:#f0a058;background:#fff8f2}
.form-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.form-card-title{font-size:15px;font-weight:700;color:var(--sun-text);flex:1;min-width:0}
.form-card-meta{font-size:11px;color:var(--sun-sub);margin-top:2px}
.form-card-status{flex:0 0 auto}
.form-card-desc{font-size:12px;color:var(--sun-sub);line-height:1.5;margin:6px 0 10px}
.form-card-progress{height:4px;background:var(--sun-border);border-radius:999px;margin:8px 0;overflow:hidden}
.form-card-progress-bar{height:100%;background:var(--sun-blue);border-radius:999px;transition:width .3s}
.form-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-status-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.form-status-badge.submitted{background:#80c977;color:#fff}
.form-status-badge.draft{background:#f0a058;color:#fff}
.form-status-badge.pending{background:var(--sun-blue);color:#fff}
/* 参与者表单卡片（全新设计） */
.member-forms-list{display:flex;flex-direction:column;gap:10px}
.member-form-card{background:var(--sun-surface);border:var(--sun-border-thin);border-radius:var(--sun-radius-card);padding:15px 16px;transition:box-shadow .15s}
.member-form-card-submitted{border-left:3px solid #80c977}
.member-form-card-draft{border-left:3px solid #f0a058}
.member-form-card-pending{border-left:3px solid var(--sun-blue)}
.member-form-card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.member-form-card-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;flex-shrink:0}
.member-form-card-submitted .member-form-card-icon{background:#e8f8ec;color:#427c3e}
.member-form-card-draft .member-form-card-icon{background:#fff4e8;color:#9a5f10}
.member-form-card-pending .member-form-card-icon{background:var(--sun-blue-soft);color:var(--sun-blue-deep)}
.member-form-card-info{flex:1;min-width:0}
.member-form-card-title{font-size:14px;font-weight:700;color:var(--sun-text);line-height:1.3}
.member-form-card-meta{font-size:11px;color:var(--sun-muted);margin-top:3px;line-height:1.3}
.member-form-status-badge{flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.member-form-status-badge.submitted{background:#e8f8ec;color:#427c3e}
.member-form-status-badge.draft{background:#fff4e8;color:#9a5f10}
.member-form-status-badge.pending{background:var(--sun-blue-soft);color:var(--sun-blue-deep)}
.member-form-card-btn{width:100%;padding:10px;border-radius:14px;border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.member-form-card-btn.submitted{background:#e8f8ec;color:#427c3e}
.member-form-card-btn.draft{background:#fff4e8;color:#9a5f10}
.member-form-card-btn.pending{background:var(--sun-blue);color:#fff}
/* 表单字段编辑器 */
.form-fields-section{margin:14px 0 10px;border:var(--sun-border-thin);border-radius:14px;overflow:hidden}
.form-fields-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sun-blue-soft);font-size:13px}
.form-fields-header strong{color:var(--sun-text)}
.form-field-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:var(--sun-border-thin);background:var(--sun-surface)}
.form-field-row:last-child{border-bottom:none}
.form-field-row-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.form-field-type-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--sun-blue-soft);color:var(--sun-blue-deep);flex-shrink:0}.form-field-type-icon svg{display:block}
.form-field-row-info{min-width:0;flex:1}.form-field-row-info strong{display:block;font-size:13px;font-weight:700;color:var(--sun-text)}.form-field-row-info span{font-size:11px;color:var(--sun-sub)}
.form-field-row-actions{display:flex;gap:6px;flex:0 0 auto}
.form-fields-empty{padding:16px 12px;font-size:12px;color:var(--sun-muted);text-align:center}
.form-preset-section{margin:10px 0 14px}
.form-preset-label{font-size:12px;color:var(--sun-sub);margin-bottom:8px;font-weight:600}
.form-preset-btns{display:flex;flex-wrap:wrap;gap:8px}
.form-preset-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:var(--sun-border-thin);border-radius:12px;background:var(--sun-surface);color:var(--sun-text);font:inherit;font-size:12px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.form-preset-btn:not(:disabled):hover{background:var(--sun-blue-soft);border-color:var(--sun-blue)}
.form-preset-btn.used,.form-preset-btn:disabled{opacity:.45;cursor:not-allowed}
.preset-btn-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--sun-blue-soft);color:var(--sun-blue-deep);flex-shrink:0}
.preset-btn-icon svg{display:block}
.preset-btn-info{display:flex;flex-direction:column;gap:1px}
.preset-btn-label{font-size:13px;font-weight:600;color:var(--sun-text);line-height:1.3}
.preset-btn-type{font-size:11px;color:var(--sun-muted);line-height:1.2}
.form-option-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.form-option-input{flex:1;height:36px;padding:0 10px;border:var(--sun-border-thin);border-radius:10px;background:var(--sun-surface);font:inherit;font-size:13px;color:var(--sun-text)}
.form-option-row button{border:0;background:transparent;color:var(--sun-muted);font-size:16px;cursor:pointer;padding:4px;line-height:1}
/* 填写表单页 */
.form-fill-panel{background:var(--sun-surface);border:var(--sun-border-thin);border-radius:var(--sun-radius-card);padding:18px 16px;margin-bottom:12px}
.form-fill-panel-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.form-fill-panel-icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--sun-blue-soft);flex-shrink:0}
.form-fill-panel-title{font-size:16px;font-weight:700;color:var(--sun-text);line-height:1.3}
.form-fill-desc{font-size:12px;color:var(--sun-sub);line-height:1.6;margin:8px 0 12px;padding:8px 10px;background:var(--sun-blue-soft);border-radius:8px}
.form-fill-fields{display:flex;flex-direction:column;gap:0;margin-top:14px}
.form-fill-fields .f-item{padding:12px 0;border-bottom:var(--sun-border-thin)}
.form-fill-fields .f-item:last-child{border-bottom:none}
.form-fill-fields label{display:block;font-size:12px;font-weight:700;color:var(--sun-sub);margin-bottom:7px}
.form-fill-fields textarea,.form-fill-fields select,.form-fill-fields input[type=text]{width:100%;padding:10px 12px;border:var(--sun-border-thin);border-radius:12px;background:#fafcfb;color:var(--sun-text);font:inherit;font-size:13px;line-height:1.55;resize:vertical}
.form-fill-fields textarea:focus,.form-fill-fields select:focus{outline:2px solid rgba(60,156,199,.16);border-color:var(--sun-blue);background:#fff}
.form-fill-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.form-fill-submit-btn{width:100%;padding:13px;border:0;border-radius:20px;background:var(--cta-grad);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(232,106,106,.28);letter-spacing:.3px}
.form-fill-draft-btn{width:100%;padding:12px;border:1.5px solid var(--sun-blue);border-radius:20px;background:transparent;color:var(--sun-blue-deep);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.form-img-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.form-img-preview{width:64px;height:64px;object-fit:cover;border-radius:10px;border:var(--sun-border-thin)}
.form-img-label{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:var(--sun-border-thin);border-radius:999px;background:var(--sun-blue-soft);color:var(--sun-blue-deep);font-size:12px;font-weight:600;cursor:pointer}
.form-img-label svg{width:14px;height:14px;flex-shrink:0}
.form-img-multi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.form-img-multi-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1}
.form-img-multi-item img{width:100%;height:100%;object-fit:cover;display:block}
.form-img-multi-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:0;color:#fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.form-img-add-btn{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--sun-blue);background:var(--sun-blue-soft);color:var(--sun-blue-deep);cursor:pointer;font-size:24px;font-weight:300;line-height:1;transition:background .15s}
.form-img-add-btn:active{background:#c8e4f5}
.form-img-add-btn svg{width:22px;height:22px;stroke:var(--sun-blue-deep);fill:none;stroke-width:1.6;stroke-linecap:round}
.form-submitted-note{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;background:#f0fbf0;border:1px solid #80c977;color:#427c3e;font-size:12px;margin-bottom:12px}
.form-draft-note{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;background:#fff8f0;border:1px solid #f0a058;color:#8b5510;font-size:12px;margin-bottom:12px}
.req{color:var(--sun-pink);font-weight:700}
/* 表单汇总弹窗 */
.form-summary-stats{display:flex;gap:10px;margin:12px 0}
.form-summary-stat{flex:1;text-align:center;padding:10px 8px;border:var(--sun-border-thin);border-radius:14px;background:var(--sun-surface)}
.form-summary-stat strong{display:block;font-size:22px;font-weight:700;color:var(--sun-blue)}
.form-summary-stat.pending strong{color:var(--sun-pink)}
.form-summary-stat span{font-size:11px;color:var(--sun-sub);margin-top:2px;display:block}
.form-summary-pending{margin:10px 0 14px;padding:10px 12px;border:var(--sun-border-thin);border-radius:12px;background:var(--sun-surface)}
.form-summary-pending-label{font-size:11px;font-weight:700;color:var(--sun-sub);margin-bottom:6px}
.form-summary-pending-names{display:flex;flex-wrap:wrap;gap:6px}
.form-summary-name{padding:3px 9px;border-radius:999px;background:var(--sun-pink-soft);color:#a84970;font-size:12px;font-weight:600}
.form-tbl-wrap{overflow-x:auto;border:var(--sun-border-thin);border-radius:12px;margin-bottom:6px}
.form-tbl{width:100%;border-collapse:collapse;font-size:12px}
.form-tbl th{background:var(--sun-blue-soft);color:var(--sun-blue-deep);font-weight:700;padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:var(--sun-border-thin)}
.form-tbl td{padding:8px 10px;border-bottom:var(--sun-border-thin);color:var(--sun-sub);white-space:nowrap}
.form-tbl tr:last-child td{border-bottom:none}
/* checkin */
.ck{display:flex;justify-content:space-between;align-items:center;background:#ffffff;border:1px solid var(--line2);border-radius:18px;padding:15px 18px;margin-bottom:13px;box-shadow:0 3px 20px rgba(90,159,212,.07),0 1px 4px rgba(0,0,0,.03)}
.ck .info .n{font-weight:600;font-size:14px;color:var(--ink)}
.ck .info .t{font-size:12px;color:var(--sub);margin-top:2px}
.ck .st-done{background:var(--okbg);color:var(--ok);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px}
.ck .st-btn{background:var(--cta-grad);color:#fff;font-size:13px;font-weight:600;padding:7px 18px;border-radius:20px;cursor:pointer;border:none;box-shadow:0 3px 10px rgba(232,106,106,.28)}
/* groups */
.grp{background:#ffffff;border:1px solid var(--line2);border-radius:18px;padding:15px 18px;margin-bottom:13px;box-shadow:0 3px 20px rgba(90,159,212,.07),0 1px 4px rgba(0,0,0,.03)}
.grp .gh{font-weight:600;margin-bottom:8px;font-size:14px;color:var(--ink)}
.grp .gm{display:flex;flex-wrap:wrap;gap:6px}
.grp .m{background:var(--coralbg);padding:4px 10px;border-radius:16px;font-size:12px;color:#a23a59;transition:transform .15s}
.grp .m.me{background:var(--cta-grad);color:#fff;font-weight:600}
/* members list */
.mem{display:flex;justify-content:space-between;align-items:center;background:#ffffff;border:1px solid var(--line2);border-radius:16px;padding:12px 15px;margin-bottom:10px;gap:10px;box-shadow:0 2px 14px rgba(90,159,212,.05),0 1px 2px rgba(0,0,0,.02)}
.mem .mn{font-weight:700;font-size:14px;color:var(--ink)}
.mem .md{font-size:11px;color:var(--sub);margin-top:2px}
.mem .mtags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mem .mtags .chip{font-size:11px;padding:3px 9px;background:var(--brand-soft);color:var(--brand)}
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:#fff;margin-bottom:13px;box-sizing:border-box;box-shadow:0 2px 8px rgba(90,159,212,.06)}
/* admin table */
.adm-top{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.stat{background:#ffffff;border:1px solid var(--line2);border-radius:18px;padding:12px 16px;flex:1;text-align:center;box-shadow:0 2px 14px rgba(90,159,212,.05),0 1px 2px rgba(0,0,0,.02)}
.stat .num{font-size:22px;font-weight:700;color:var(--brand)}
.stat .lb{font-size:11px;color:var(--sub)}
.tbl-wrap{overflow-x:auto;background:#ffffff;border:1px solid var(--line);border-radius:18px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:12px;white-space:nowrap}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--brand-soft);position:sticky;top:0;font-weight:600;color:var(--brand)}
td.name-col{position:sticky;left:0;background:#fff;font-weight:600;z-index:1}
th.name-col{position:sticky;left:0;z-index:2;background:var(--brand-soft)}
.tbl-wrap-sticky td.name-col,.tbl-wrap-sticky th.name-col{box-shadow:2px 0 4px rgba(0,0,0,.06)}
tr:nth-child(even) td{background:#f7fafd}
tr:nth-child(even) td.name-col{background:#f7fafd}
.mini{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:#fff}
.mini.del{color:var(--red);border-color:#fecaca}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:end;justify-content:center;z-index:60}
.sheet{background:#fff;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px}
.sheet h3{font-size:17px;margin-bottom:14px}
.sheet .grpttl{font-size:12px;color:var(--brand);font-weight:700;margin:14px 0 6px}
/* tabbar · 林芝晴日统一线性图标 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--sun-surface);border-top:var(--sun-border-thin);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:none}
.tab{flex:1;text-align:center;padding:8px 0 7px;font-size:11px;color:var(--sun-muted);cursor:pointer;transition:color .2s}
.tab.on{color:var(--sun-blue)}
.tab .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 1px;line-height:1}
.tab .ic svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-note{text-align:center;color:#94a3b8;font-size:13px;padding:30px}
.hint{font-size:12px;color:var(--sub);background:#fffef8;border:1px solid #f5e6c8;padding:10px 14px;border-radius:14px;margin-bottom:13px}
/* tips */
.tip-body{font-size:13px;color:#374151;line-height:1.7}

/* 流云（白色，柔和飘动） */
.bg-cloud{position:absolute;background:rgba(255,255,255,.35);border-radius:50%;filter:blur(3px)}
.bg-cloud::before,.bg-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.bg-cloud.c1{width:100px;height:32px;top:10%;left:-30%;animation:drift 52s linear infinite}
.bg-cloud.c1::before{width:52px;height:52px;top:-22px;left:16px}
.bg-cloud.c1::after{width:38px;height:38px;top:-14px;left:52px}
.bg-cloud.c2{width:72px;height:24px;top:22%;left:-30%;animation:drift 68s linear infinite;animation-delay:-26s;opacity:.14}
.bg-cloud.c2::before{width:38px;height:38px;top:-16px;left:12px}
.bg-cloud.c2::after{width:28px;height:28px;top:-10px;left:38px}
.bg-cloud.c3{width:120px;height:36px;top:6%;left:-30%;animation:drift 86s linear infinite;animation-delay:-48s;opacity:.18}
.bg-cloud.c3::before{width:58px;height:58px;top:-26px;left:20px}
.bg-cloud.c3::after{width:42px;height:42px;top:-16px;left:60px}

.bg-river{position:absolute;bottom:0;left:0;width:100%;height:15%;background:linear-gradient(180deg,rgba(138,173,221,.3),rgba(90,159,212,.18))}
.bg-wave{position:absolute;bottom:0;left:0;width:200%;height:100%}

@keyframes floatUp{0%{transform:translateY(106vh) translateX(0) scale(.5);opacity:0}15%{opacity:.6}85%{opacity:.4}100%{transform:translateY(-6vh) translateX(30px) scale(1);opacity:0}}

/* ============== 配置（由生成器注入，每个活动不同） ==============

 *
 * 【A类·活动基本信息】EVENT_TITLE / EVENT_SUBTITLE / EVENT_DATE / ADMIN_PWD_DEFAULT
 * 【B类·人员与分组规则】NAME_FIELD / SUB_FIELD / GROUP_FIELDS / CHIP_FIELDS / DATA.fields / DATA.people

 * ============================================================== */

/* ---- 【A类·活动基本信息】活动名称、副标题（可选）、活动日期（海报展示用）、组织者口令默认值 ---- */

/* ---- 【D类·云同步与部署参数】仓库、分支、同步文件、访问令牌、API基址 ---- */
/* 改造说明（方案③·一次性生成专属版）：同步配置不再依赖 localStorage 跨设备保存，
 * 而是组织者在「活动设置→云同步」里填一次，点「生成我的专属版」后，
 * 浏览器会下载一份把这些配置直接写死在下面 SYNC_BAKED 里的新 index.html。
 * 组织者用这份新文件覆盖自己仓库后，任何人、任何设备打开都已经是配置好的状态，
 * 不会再弹任何设置向导。SYNC_BAKED 为空对象即代表"尚未生成专属版，同步关闭"。 */
const SYNC_BAKED = {};
const SYNC_CFG_KEY = "tj_sync_cfg_v1";
function loadSyncCfg(){
  // 已烧录专属版：直接用烧录值，不再看 localStorage，确保换设备/换浏览器都一致
  if(SYNC_BAKED && (SYNC_BAKED.repo || SYNC_BAKED.token)){
    return Object.assign({enabled:true}, SYNC_BAKED);
  }
  try{
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && typeof o === "object") return o; }
  }catch(e){}
  return {};
}
const _syncCfg = loadSyncCfg();
let SYNC_ENABLED = _syncCfg.enabled === true;
let SYNC_REPO = _syncCfg.repo || "";
let SYNC_BRANCH = _syncCfg.branch || "main";
let SYNC_FILE = _syncCfg.file || "sync-data.json";
let SYNC_API_BASE = _syncCfg.apiBase || ""; // 留空=GitHub；腾讯内网用工蜂请填：https://git.woa.com/api/v3
let GITHUB_SYNC_TOKEN = _syncCfg.token || ""; // 同步令牌：由首次设置向导保存，不写在代码里

// 同步API基址：优先用配置里的 SYNC_API_BASE，未配置则回退 GitHub 官方 API
let SYNC_API_ROOT = (SYNC_API_BASE && SYNC_API_BASE.trim() !== "") ? SYNC_API_BASE.replace(/\/+$/,"") : "https://api.github.com";

// 保存同步配置（仅当次会话生效，用于填完立即校验连接），真正长期生效靠"生成专属版"烧录进文件
function saveSyncCfg(cfg){
  const next = Object.assign({}, _syncCfg, cfg, { enabled:true });
  try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(next)); }catch(e){}
  _syncCfg.enabled = true; _syncCfg.repo = next.repo; _syncCfg.branch = next.branch;
  _syncCfg.file = next.file; _syncCfg.apiBase = next.apiBase; _syncCfg.token = next.token;
  _syncCfg.admin = next.admin;
  applySyncVars();
}
// 把 _syncCfg 的当前值刷到同步变量（向导保存后无需刷新页面即可生效）
function applySyncVars(){
  SYNC_ENABLED   = _syncCfg.enabled === true;
  SYNC_REPO      = _syncCfg.repo || "";
  SYNC_BRANCH    = _syncCfg.branch || "main";
  SYNC_FILE      = _syncCfg.file || "sync-data.json";
  SYNC_API_BASE  = _syncCfg.apiBase || "";
  GITHUB_SYNC_TOKEN = _syncCfg.token || "";
  SYNC_API_ROOT  = (SYNC_API_BASE && SYNC_API_BASE.trim() !== "") ? SYNC_API_BASE.replace(/\/+$/,"") : "https://api.github.com";
}
// 是否已是"专属版"（配置已烧录进代码，任何设备打开都生效，无需再设置）
function hasSyncSetup(){ return !!( SYNC_BAKED && (SYNC_BAKED.repo || SYNC_BAKED.token) ); }
// 打开「云同步设置」（组织者在活动设置里主动点击才会打开，不再自动弹出）
function openSyncSetup(){ showSyncSetup(); }
// 生成"我的专属版" index.html：把当前填写的同步配置直接写死进 SYNC_BAKED 常量，
// 下载后覆盖到组织者自己的仓库，任何人打开这份文件都已是配置好的状态，不再弹设置框。
async function generateBakedCopy(cfg){
  const res = await fetch(location.href, { cache: "no-store" });
  if(!res.ok) throw new Error("无法读取当前页面源码（HTTP "+res.status+"）");
  let html = await res.text();
  const bakedObj = { repo: cfg.repo||"", token: cfg.token||"", branch: cfg.branch||"main", apiBase: cfg.apiBase||"", file: "sync-data.json", admin: cfg.admin||"" };
  const bakedLine = "const SYNC_BAKED = " + JSON.stringify(bakedObj) + ";";
  const re = /const SYNC_BAKED = \{[^\n]*\};/;
  if(!re.test(html)) throw new Error("未找到可替换的配置位置，可能页面源码结构已变化");
  html = html.replace(re, bakedLine);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

else state.moduleVisibility = Object.assign(MODULE_VISIBILITY_DEFAULT,state.moduleVisibility);

if(!state._edited) state._edited = {};

  if(!Array.isArray(state.people)) state.people=[];

    if(!exists) state.people.push(JSON.parse(JSON.stringify(account)));

}
function mergeSavedPeople(savedPeople){
  if(!Array.isArray(savedPeople)) return;
  const embeddedById=new Map(DATA.people.map(p=>[p._id,p]));
  const savedIds=new Set();
  const merged=[];
  savedPeople.forEach(savedPerson=>{
    if(!savedPerson || !savedPerson._id) return;

    const savedWxId=person["企微ID"]==null?"":String(person["企微ID"]).trim();

    if(!savedWxId && embeddedWxId) person["企微ID"]=embedded["企微ID"];
    merged.push(person);
  });
  DATA.people.forEach(p=>{ if(p && p._id && !savedIds.has(p._id)) merged.push(JSON.parse(JSON.stringify(p))); });
  if(merged.length) state.people=merged;
}

function mergePushNotices(localItems, remoteItems){

function safeExportName(value){return String(value||"").replace(/[\\/:*?"<>|\s]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")||"file";}
function dataUrlToBytes(dataUrl){const base64=dataUrl.split(",")[1]||"";const bin=atob(base64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
function guessExt(dataUrl){const m=(dataUrl||"").match(/^data:image\/([a-z]+)/i);return m?m[1].replace("jpeg","jpg"):"jpg";}
async function exportCheckins(taskId){
  const task=state.checkinTasks.find(x=>x.id===taskId),rows=checkinTaskSubmissions(taskId);if(!task)return;
  if(!rows.length){toast("当前没有可导出的提交");return;}
  if(typeof JSZip==="undefined"){toast("打包库未加载，请检查网络后刷新重试");return;}
  const btn=document.querySelector('[onclick*="exportCheckins(\''+taskId+'\'"]');
  const origLabel=btn?btn.textContent:"导出统计";
  if(btn){btn.textContent="正在打包…";btn.disabled=true;}
  try{
    const zip=new JSZip(),photoFolder=zip.folder("照片"),dateStr=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"-");
    const csvRows=[["任务","提交人","提交时间","文字说明","照片数","图片路径"]];
    for(const sub of rows){
      const local=localCheckinImages[sub.id]||[];
      const photoPaths=[];
      sub.images.forEach((image,index)=>{
        const src=local[index]||image.shared||image.thumb;
        if(!src)return;
        const ext=guessExt(src),fileName=safeExportName(sub.userName)+"_"+(index+1)+"."+ext;
        try{photoFolder.file(fileName,dataUrlToBytes(src));}catch(e){}
        photoPaths.push("照片/"+fileName);
      });
      csvRows.push([task.title,sub.userName,new Date(sub.createdAt).toLocaleString("zh-CN",{hour12:false}),sub.text,sub.images.length,photoPaths.join("；")]);
    }
    const csv=csvRows.map(row=>row.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
    zip.file("统计表.csv","\ufeff"+csv);
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=safeExportName(task.title)+"-打卡统计-"+dateStr+".zip";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast("ZIP 已下载，含 CSV 统计表和全部照片");
  }catch(e){toast("导出失败："+String(e.message||e));}
  finally{if(btn){btn.textContent=origLabel;btn.disabled=false;}}
}

/* ============== 参与者主页：目的地实时天气（Open-Meteo） ============== */
const WEATHER_CODES={0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"有雾",48:"雾凇",51:"小毛雨",53:"毛毛雨",55:"较强毛雨",56:"冻毛雨",57:"强冻毛雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"强冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",80:"阵雨",81:"较强阵雨",82:"强阵雨",85:"阵雪",86:"强阵雪",95:"雷雨",96:"雷雨伴雹",99:"强雷雨伴雹"};
function weatherIcon(code){
  if(code===0||code===1) return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  if((code>=71&&code<=77)||(code>=85&&code<=86)) return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14h9.5a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.2 7.2 3.6 3.6 0 0 0 7 14Z"/><path d="M9 18h.01M13 20h.01M17 18h.01"/></svg>`;
  if(code>=51&&code<=82) return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15h9.5a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.2 8.2 3.6 3.6 0 0 0 7 15Z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/></svg>`;
  if(code>=95) return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14h9.5a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 7.2 7.2 3.6 3.6 0 0 0 7 14Z"/><path d="M13 16l-2 3h2l-2 3"/></svg>`;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16h10a4 4 0 0 0 .3-8A5.5 5.5 0 0 0 6.8 9 3.5 3.5 0 0 0 7 16Z"/></svg>`;
}
function weatherDate(){
  const parts=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"numeric",day:"numeric"}).formatToParts(new Date());
  const month=parts.find(p=>p.type==="month"),day=parts.find(p=>p.type==="day");
  return month&&day?`${month.value}月${day.value}日`:"今日";
}
function weatherRender(data){
  const box=document.getElementById("profileWeather");
  if(!box||!data||!state.weatherDest) return;
  const temp=Number.isFinite(data.temp)?data.temp:"—";
  const text=WEATHER_CODES[data.code]||"天气更新中";
  const destName=state.weatherDest.name;
  box.innerHTML=`<div class="profile-weather-head"><span>${esc(destName)} · ${esc(weatherDate())}</span><button class="profile-weather-refresh" onclick="weatherLoad(true)" title="刷新天气">刷新</button></div><div class="profile-weather-main"><span class="profile-weather-icon">${weatherIcon(data.code)}</span><strong class="profile-weather-temp">${esc(String(temp))}℃</strong><span class="profile-weather-text">${esc(text)}</span></div>`;
}
function weatherError(){
  const box=document.getElementById("profileWeather");
  if(box) box.innerHTML=`<div class="profile-weather-error">天气暂未更新</div><button class="profile-weather-retry" onclick="weatherLoad(true)">重新加载</button>`;
}
async function weatherLoad(force=false){
  const box=document.getElementById("profileWeather");
  if(!box) return;
  const dest=(state.weatherDest&&Number.isFinite(state.weatherDest.lat)&&Number.isFinite(state.weatherDest.lng))?state.weatherDest:null;
  if(!dest){box.innerHTML=`<div class="profile-weather-error">天气城市待设置</div>`;return;}
  const cacheKey=LS_KEY+"_linzhi_weather_"+dest.lat+"_"+dest.lng;
  if(!force){
    try{
      const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
      if(cached&&cached.savedAt&&Date.now()-cached.savedAt<WEATHER_CACHE_TTL){weatherRender(cached.data);return;}
    }catch(e){}
  }
  box.innerHTML=`<div class="profile-weather-loading">天气加载中</div><div class="profile-weather-skeleton"></div><div class="profile-weather-skeleton short"></div>`;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${dest.lat}&longitude=${dest.lng}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=1`;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try{
    const response=await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error("weather request failed");
    const json=await response.json();
    const current=json.current||{},daily=json.daily||{};
    const temp=Number(current.temperature_2m),code=Number(current.weather_code),low=Number((daily.temperature_2m_min||[])[0]),high=Number((daily.temperature_2m_max||[])[0]);
    const data={temp:Number.isFinite(temp)?Math.round(temp):NaN,code:Number.isFinite(code)?code:-1,low:Number.isFinite(low)?Math.round(low):NaN,high:Number.isFinite(high)?Math.round(high):NaN,updated:new Date().toISOString()};
    if(!Number.isFinite(data.temp)) throw new Error("weather data missing");
    try{localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),data}));}catch(e){}
    weatherRender(data);
  }catch(e){weatherError();}
  finally{clearTimeout(timer);}
}
/* 组织者后台：输入城市名，通过 Open-Meteo 免费地理编码接口自动解析经纬度（无需密钥） */
async function weatherDestSearch(cityName){
  const box=document.getElementById("weatherDestResult");
  const name=String(cityName||"").trim();
  if(!name){ if(box) box.innerHTML=`<div class="hint" style="color:#e05252">请先输入城市名</div>`; return; }
  if(box) box.innerHTML=`<div class="hint">正在解析「${esc(name)}」的位置…</div>`;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try{
    const url=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=zh&format=json`;
    const response=await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error("geocoding request failed");
    const json=await response.json();
    const results=Array.isArray(json.results)?json.results:[];
    if(!results.length) throw new Error("未找到该城市，请尝试更换关键词（如改用英文或更知名的地名）");
    ctx._weatherDestCandidates=results;
    const rows=results.map((r,i)=>{
      const label=[r.name,r.admin1,r.country].filter(Boolean).join(" · ");
      return `<div onclick="applyWeatherDest(${i})" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:var(--sun-border-thin);border-radius:12px;margin-top:6px;cursor:pointer;background:#fff"><span style="font-size:14px;color:var(--sun-text)">${esc(label)}</span><span style="color:var(--sun-blue);font-size:12px;font-weight:600">选择</span></div>`;
    }).join("");
    if(box) box.innerHTML=`<div class="hint">找到 ${results.length} 个匹配结果，请选择目的地：</div>${rows}`;
  }catch(e){
    if(box) box.innerHTML=`<div class="hint" style="color:#e05252">${esc(String(e.message||"解析失败，请重试"))}</div>`;
  }finally{clearTimeout(timer);}
}
function applyWeatherDest(index){
  const results=ctx._weatherDestCandidates||[];
  const r=results[index];
  if(!r) return;
  state.weatherDest={name:r.name,lat:Number(r.latitude),lng:Number(r.longitude)};
  persist();
  const box=document.getElementById("weatherDestResult");
  if(box) box.innerHTML=`<div class="hint" style="color:#2d9f6e">已设为「${esc(r.name)}」。${SYNC_ENABLED?"点击顶部「同步」后，参与者主页天气会更新。":"参与者主页天气会更新。"}</div>`;
  toast(`天气城市已设为「${r.name}」✅`);
}

function formFillPage(formId){

      const itImgs=Array.isArray(itVal.imgs)?itVal.imgs:(itVal.img?(typeof itVal.img==="object"&&(itVal.img.full||itVal.img.thumb)?[itVal.img]:[]):[]);

    <button class="interaction-back" onclick="ctx.groupsSubTab='submissions';go('groups')"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>返回提交</button>

        <button class="form-fill-draft-btn" onclick="saveDraftFormFill('${esc(formId)}')">保存草稿</button>
      </div>
    </section>

}
function formDraftSave(formId,el){
  if(!_formDraft[formId])_formDraft[formId]={};
  _formDraft[formId][el.dataset.fid]=el.value;
}
function formMultiSelectChange(formId,fieldId,cb){
  if(!_formDraft[formId])_formDraft[formId]={};
  const cur=Array.isArray(_formDraft[formId][fieldId])?[..._formDraft[formId][fieldId]]:[];
  if(cb.checked){if(!cur.includes(cb.value))cur.push(cb.value);}
  else{const i=cur.indexOf(cb.value);if(i>=0)cur.splice(i,1);}
  _formDraft[formId][fieldId]=cur;
  // 同步视觉状态
  const lbl=cb.closest(".form-multisel-item");if(lbl)lbl.classList.toggle("checked",cb.checked);

function formValidateField(el,type){
  const errEl=document.getElementById("fve_"+el.dataset.fid);if(!errEl)return;
  const v=(el.value||"").trim();

  if(type==="phone"){

    errEl.textContent=ok?"":"请输入11位有效手机号码";
  } else if(type==="idcard"){

function _collectFormDraft(formId){
  // 从页面 DOM 中同步最新值（image_text 的文字部分通过 formImageTextSave 实时同步，此处只补全普通字段）
  const draft=_formDraft[formId]||{};
  document.querySelectorAll('[data-fid]').forEach(el=>{
    if(el.dataset.itText) return; // image_text 文字部分已由 formImageTextSave 同步，跳过
    if(el.classList.contains('form-multisel-list')) return; // multiselect 由 formMultiSelectChange 维护，跳过
    draft[el.dataset.fid]=el.value;
  });
  _formDraft[formId]=draft;

function saveDraftFormFill(formId){
  const draft=_collectFormDraft(formId);
  const me=findMe();if(!me)return;
  if(!Array.isArray(state.formSubmissions))state.formSubmissions=[];
  const idx=state.formSubmissions.findIndex(s=>s.formId===formId&&s.userId===me._id);
  const record={formId,userId:me._id,data:JSON.parse(JSON.stringify(draft)),isDraft:true,updatedAt:new Date().toISOString()};
  if(idx>=0)state.formSubmissions[idx]=Object.assign({},state.formSubmissions[idx],record);
  else state.formSubmissions.push(Object.assign({submittedAt:""},record));
  persist();toast("草稿已保存");
}
function submitFormFill(formId){
  const draft=_collectFormDraft(formId);
  const form=formById(formId);if(!form)return;
  const me=findMe();if(!me)return;
  // 必填校验（兼容 string / 单图对象 / 多图数组 / image_text 对象）
  for(const f of form.fields){
    if(!f.required) continue;
    const v=draft[f.id];
    let empty=false;
    if(!v) empty=true;
    else if(typeof v==="string") empty=v.trim()==="";
    else if(Array.isArray(v)) empty=v.length===0;
    else if(typeof v==="object"){
      // 单图对象 {full,thumb}
      if("full" in v||"thumb" in v) empty=!v.full&&!v.thumb;
      // image_text 对象 {imgs,text}
      else if("imgs" in v||"text" in v) empty=(!v.imgs||!v.imgs.length)&&(!v.text||!v.text.trim());
    }
    if(empty){toast(`请填写「${f.label}」`);return;}
  }
  // 格式校验（手机号 / 身份证号）
  for(const f of form.fields){
    if(!f.validation) continue;
    const v=(draft[f.id]||"").toString().trim();
    if(!v) continue; // 非必填且为空，跳过
    if(f.validation==="phone"&&!/^1[3-9]\d{9}$/.test(v)){
      toast(`「${f.label}」请输入11位有效手机号码`);
      // 同步高亮错误提示
      const errEl=document.getElementById("fve_"+f.id);if(errEl)errEl.textContent="请输入11位有效手机号码";
      return;
    }
    if(f.validation==="idcard"&&!/^\d{17}[\dXx]$/.test(v)){
      toast(`「${f.label}」请输入18位有效身份证号`);
      const errEl=document.getElementById("fve_"+f.id);if(errEl)errEl.textContent="请输入18位有效身份证号";
      return;
    }
  }
  if(!Array.isArray(state.formSubmissions))state.formSubmissions=[];
  const idx=state.formSubmissions.findIndex(s=>s.formId===formId&&s.userId===me._id);
  const now=new Date().toISOString();
  const record={formId,userId:me._id,data:JSON.parse(JSON.stringify(draft)),isDraft:false,submittedAt:now,updatedAt:now};
  if(idx>=0)state.formSubmissions[idx]=Object.assign({},state.formSubmissions[idx],record);
  else state.formSubmissions.push(record);
  persist();toast("提交成功！✅");ctx.groupsSubTab="submissions";go("groups");
}
/* ============== 参与者自推：只回传自己那条记录（双向同步） ============== */
async function pushMyRecord(){
  if(!SYNC_ENABLED) return;
  const me=findMe();
  if(!me || !me._id) return;
  // 仅推送「成员可自行编辑」的字段，避免越权改分组/后台字段
  const keys=(state.fields||[]).filter(f=>f.editor==="member").map(f=>f.key);
  const patch={_id:me._id};
  keys.forEach(k=>{ if(me[k]!==undefined) patch[k]=me[k]; });
  async function attempt(){
    const rd=await syncRead();
    const cloud=rd.content||{};
    const people=(cloud.people||[]).slice();
    const idx=people.findIndex(p=>p._id===me._id);
    if(idx>=0){ keys.forEach(k=>{ people[idx][k]=patch[k]; }); }
    else { people.push(patch); }
    state.operationLogs=mergeOperationLogs(state.operationLogs,cloud.operationLogs||[]);
    state.polls=mergePolls(state.polls,cloud.polls||[]);
    state.voteBallots=mergeVoteBallots(state.voteBallots,cloud.voteBallots||[]);
    state.checkinTasks=mergeCheckinTasks(state.checkinTasks,cloud.checkinTasks||[]);
    state.checkinSubmissions=mergeCheckinSubmissions(state.checkinSubmissions,cloud.checkinSubmissions||[]);
    persist();
    const payload=Object.assign({},cloud,{people:people,operationLogs:sharedOperationLogs(state.operationLogs),polls:state.polls,voteBallots:state.voteBallots,checkinTasks:state.checkinTasks,checkinSubmissions:state.checkinSubmissions,_ts:Date.now()});
    await syncWrite(payload, rd.sha);
  }
  for(let i=0;i<3;i++){
    try{ await attempt(); clearEdited(me._id); toast("✅ 你的修改已同步给组织者"); return; }
    catch(e){ if(/409/.test(e.message) && i<2) continue; toast("同步失败，可稍后点「重新同步」重试"); return; }
  }
}
async function pushInteractionData(){
  if(!SYNC_ENABLED)return false;
  for(let i=0;i<3;i++){
    try{
      const rd=await syncRead();
      const cloud=rd.content||{};
      state.polls=mergePolls(state.polls,cloud.polls||[]);
      state.voteBallots=mergeVoteBallots(state.voteBallots,cloud.voteBallots||[]);
      state.checkinTasks=mergeCheckinTasks(state.checkinTasks,cloud.checkinTasks||[]);
      state.checkinSubmissions=mergeCheckinSubmissions(state.checkinSubmissions,cloud.checkinSubmissions||[]);
      state.operationLogs=mergeOperationLogs(state.operationLogs,cloud.operationLogs||[]);
      persist();
      const payload=Object.assign({},cloud,{polls:state.polls,voteBallots:state.voteBallots,checkinTasks:state.checkinTasks,checkinSubmissions:state.checkinSubmissions,operationLogs:sharedOperationLogs(state.operationLogs),_ts:Date.now()});
      await syncWrite(payload, rd.sha);
      return true;
    }catch(e){if(!/409/.test(e.message)||i===2)return false;}
  }
  return false;
}
const pushVoteData=pushInteractionData;
async function submitPoll(pollId){
  const poll=state.polls.find(x=>x.id===pollId),me=findMe();
  if(!poll||!me||isGuestMember()){toast("仅活动成员可参与投票");return;}
  if(pollClosed(poll)){toast("该投票已截止");render();return;}
  if(myPollBallot(pollId)){toast("你已经提交过该投票");render();return;}
  const optionIds=[...document.querySelectorAll(`input[name="poll_${pollId}"]:checked`)].map(x=>x.value).filter(id=>poll.options.some(o=>o.id===id));
  if(!optionIds.length){toast("请先选择投票选项");return;}
  if(poll.type==="single"&&optionIds.length!==1){toast("该投票只能选择一项");return;}
  const before=beginOperation(["voteBallots"]),now=new Date().toISOString();
  state.voteBallots=mergeVoteBallots(state.voteBallots,[{id:"ballot_"+pollId+"_"+me._id,pollId,userId:me._id,userName:displayName(me),optionIds,createdAt:now,updatedAt:now,deletedAt:""}]);
  recordOperation("vote","参与了投票「"+poll.question+"」",["voteBallots"],before,false,{kind:"ballot_submit",pollId,userId:me._id,version:now});
  persist();render();toast("投票已保存，正在同步…");
  const ok=await pushVoteData();
  if(ok){render();toast("投票已同步，结果会随自动刷新更新");}else toast("已保存在本机，网络恢复后请点同步重试");
}
